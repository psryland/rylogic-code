<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Audio authoring</title>
<style>
	:root
	{
		--bg: #15161a; --panel: #1d1f24; --panel2: #23262c; --raised: #2b2f36; --hover: #343942; --border: #31353c; --border2: #434851;
		--text: #e3e6ea; --muted: #8b919b; --accent: #5b8def; --accent-bg: #22314b; --good: #3fb871; --good-bg: #1b3125;
		--warn: #e5b04a; --bad: #e5675c; --bad-bg: #3a2224; --radius: 8px;
	}
	* { box-sizing: border-box; }
	[hidden] { display: none !important; }
	html, body { height: 100%; }
	body
	{
		margin: 0; font: 13.5px/1.45 "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text);
		display: grid; grid-template: "top top" auto "side main" 1fr "side player" auto / 280px 1fr; overflow: hidden;
	}
	a { color: #8ab4f8; text-decoration: none; }
	a:hover { text-decoration: underline; }
	code { background: var(--raised); padding: 0 4px; border-radius: 4px; }
	.muted { color: var(--muted); }
	.warn { color: var(--warn); }
	.error { color: var(--bad); }
	kbd { background: var(--raised); border: 1px solid var(--border2); border-radius: 4px; padding: 0 5px; font-size: 11px; }

	/* Controls */
	button
	{
		background: var(--raised); color: var(--text); border: 1px solid var(--border2); border-radius: 6px; padding: 4px 10px;
		font: inherit; cursor: pointer; transition: background .12s, border-color .12s; white-space: nowrap;
	}
	button:hover { background: var(--hover); }
	button:disabled { opacity: 0.4; cursor: default; background: var(--raised); }
	button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
	button.primary:hover { background: #6d9bf2; }
	button.on { background: var(--accent-bg); border-color: var(--accent); color: #cfe0ff; }
	button.icon { width: 28px; height: 28px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
	button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
	button.ghost:hover { background: var(--hover); color: var(--text); }
	button.danger:hover { background: var(--bad-bg); border-color: var(--bad); color: #ffd6d2; }
	input[type=text], input[type=search], input[type=number], select
	{
		background: var(--bg); color: var(--text); border: 1px solid var(--border2); border-radius: 6px; padding: 4px 8px; font: inherit; min-width: 0;
	}
	input:focus, select:focus, button:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px #5b8def40; }
	input:disabled, select:disabled { opacity: 0.45; }
	input[type=number] { width: 80px; }
	input[type=checkbox]
	{
		appearance: none; width: 30px; height: 17px; border-radius: 9px; background: var(--border2); position: relative; cursor: pointer;
		margin: 0; flex: none; transition: background .15s; vertical-align: middle;
	}
	input[type=checkbox]::before
	{
		content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: #d7dbe0; transition: left .15s;
	}
	input[type=checkbox]:checked { background: var(--accent); }
	input[type=checkbox]:checked::before { left: 15px; background: #fff; }
	label.toggle { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; color: var(--muted); }
	label.toggle:hover { color: var(--text); }
	.seg { display: inline-flex; }
	.seg button { border-radius: 0; margin-left: -1px; }
	.seg button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
	.seg button:last-child { border-radius: 0 6px 6px 0; }
	.seg button.on { position: relative; z-index: 1; }

	/* Top bar */
	#topbar
	{
		grid-area: top; display: flex; align-items: center; gap: 16px; padding: 0 16px; height: 46px;
		background: var(--panel); border-bottom: 1px solid var(--border);
	}
	#topbar .brand { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; }
	#topbar .brand .logo { color: var(--accent); font-size: 18px; }
	#status { flex: 1; display: flex; align-items: center; gap: 16px; min-width: 0; font-size: 12.5px; }
	#status > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	#status #message { flex: 1; min-width: 0; text-align: right; }
	#fssetup { display: inline-flex; gap: 6px; align-items: center; }
	#fssetup[hidden] { display: none; }
	.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
	.dot.ok { background: var(--good); }
	.dot.no { background: var(--warn); }

	/* Sound list */
	#sidebar { grid-area: side; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--border); min-height: 0; }
	#sidebar .side-head { display: flex; gap: 8px; padding: 12px; border-bottom: 1px solid var(--border); }
	#sidebar .side-head input { flex: 1; }
	#ids { flex: 1; overflow-y: auto; padding: 6px 8px 16px; }
	#ids h3 { font-size: 11px; font-weight: 600; color: var(--muted); margin: 14px 8px 4px; text-transform: uppercase; letter-spacing: .6px; }
	#ids div.id
	{
		padding: 5px 8px; cursor: pointer; border-radius: 6px; display: flex; align-items: center; gap: 8px; justify-content: space-between;
	}
	#ids div.id > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	#ids div.id:hover { background: var(--hover); }
	#ids div.id.sel { background: var(--accent-bg); box-shadow: inset 3px 0 var(--accent); }
	#ids div.id.final > span:first-child::before { content: "\25CF"; color: var(--good); margin-right: 6px; font-size: 9px; vertical-align: 2px; }
	#ids div.id.pool { margin-bottom: 4px; font-weight: 600; }
	.badges { display: inline-flex; gap: 4px; flex: none; }
	.badge { font-size: 11px; padding: 0 6px; border-radius: 9px; background: var(--raised); color: var(--muted); line-height: 17px; }
	.badge.good { background: var(--good-bg); color: var(--good); }
	.badge.new { background: var(--accent-bg); color: #9dbdff; }

	/* Main panel */
	#main { grid-area: main; overflow-y: auto; padding: 20px 28px 28px; min-height: 0; }
	#main.dropping { outline: 2px dashed var(--accent); outline-offset: -8px; }
	#head { margin-bottom: 16px; }
	#head h1 { font-size: 22px; font-weight: 600; margin: 0 0 8px; }
	#chips { display: flex; flex-wrap: wrap; gap: 6px; }
	.chip { font-size: 12px; padding: 1px 9px; border-radius: 10px; background: var(--raised); border: 1px solid var(--border); color: #c2c7cf; }
	.chip.k { color: var(--muted); }
	#desc { margin: 8px 0 0; max-width: 900px; }
	#desc:empty { display: none; }
	.card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 16px; }
	.card-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
	.card-head h2 { font-size: 14px; font-weight: 600; margin: 0; }
	.card-head .sub { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
	.card-body { padding: 12px 14px; }
	.spacer { flex: 1; }
	details.card > summary
	{
		padding: 10px 14px; cursor: pointer; font-weight: 600; font-size: 14px; list-style: none; display: flex; align-items: center; gap: 8px;
	}
	details.card > summary::-webkit-details-marker { display: none; }
	details.card > summary::before { content: "\25B8"; color: var(--muted); transition: transform .15s; }
	details.card[open] > summary::before { transform: rotate(90deg); }
	details.card[open] > summary { border-bottom: 1px solid var(--border); }

	/* Sound settings */
	.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px 16px; padding: 14px; }
	.f { display: flex; flex-direction: column; gap: 4px; }
	.f > span:first-child { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
	.f.w2 { grid-column: span 2; }
	.f.wide { grid-column: 1 / -1; }
	.f.check { flex-direction: row; align-items: center; gap: 8px; padding-top: 18px; }
	.f.check > span:first-child { order: 2; text-transform: none; letter-spacing: 0; font-size: 13.5px; color: var(--text); }
	.f .range-pair { display: flex; align-items: center; gap: 6px; }
	.f .range-pair input { flex: 1; width: 0; }
	.actions { display: flex; align-items: center; gap: 8px; padding: 0 14px 14px; }

	/* Recordings */
	table { border-collapse: collapse; width: 100%; }
	td, th { padding: 6px 10px; text-align: left; vertical-align: middle; }
	tr.section th { padding: 14px 14px 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); font-weight: 600; }
	tr.section th button { margin-left: 10px; text-transform: none; letter-spacing: 0; font-weight: normal; }
	tr.cols th { font-size: 11px; color: #6c727b; font-weight: 500; padding-top: 0; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
	tr.row td { border-bottom: 1px solid var(--border); }
	tr.row:hover td { background: #ffffff05; }
	tr.row td:first-child { white-space: nowrap; padding-left: 14px; }
	tr.row td:first-child button { margin-right: 3px; }
	tr.accepted td:first-child { box-shadow: inset 3px 0 var(--good); }
	tr.rejected td { opacity: 0.45; }
	tr.current td { background: var(--accent-bg) !important; }
	tr.current td:first-child { box-shadow: inset 3px 0 var(--accent); }
	td.rec { min-width: 140px; }
	.decide .seg.status button { padding-left: 8px; padding-right: 8px; }
	.order { display: inline-flex; flex-direction: column; vertical-align: middle; margin-right: 4px; }
	.order button.icon { height: 18px; font-size: 10px; }
	.decide { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
	.decide input.note { flex: 1 1 140px; width: auto; min-width: 120px; }
	.decide select { flex: 0 1 auto; max-width: 180px; }
	td.rec .vid { font-size: 11px; color: var(--muted); background: var(--raised); border-radius: 4px; padding: 0 5px; margin-right: 6px; }
	.seg.status button.on.s-accepted { background: var(--good-bg); border-color: var(--good); color: #a6e8bf; }
	.seg.status button.on.s-candidate { background: var(--accent-bg); border-color: var(--accent); }
	.seg.status button.on.s-rejected { background: var(--bad-bg); border-color: var(--bad); color: #ffc4bf; }
	button.fin.on { background: var(--good-bg); border-color: var(--good); color: #a6e8bf; }
	input.note { width: 100%; }
	.empty { padding: 10px 14px; color: var(--muted); font-style: italic; }
	#sources { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-top: 1px solid var(--border); background: var(--panel2); border-radius: 0 0 var(--radius) var(--radius); }
	#sources .src { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
	#sources .src > .lbl { width: 120px; color: var(--muted); font-size: 12.5px; }
	#findrow[hidden] { display: none; }
	#importform { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; }
	#importform .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 3px 0; }
	#importform label.wide { flex: 1; display: flex; gap: 6px; align-items: center; color: var(--muted); }

	/* Recipe */
	#recipe .listen { display: flex; align-items: center; gap: 10px; padding: 12px 14px 4px; flex-wrap: wrap; }
	#recipe .lbl { color: var(--muted); font-size: 12.5px; }
	#recipe .steps { padding: 8px 14px; display: flex; flex-direction: column; gap: 6px; }
	#recipe .step
	{
		display: flex; align-items: center; gap: 10px; padding: 6px 8px; background: var(--panel2); border: 1px solid var(--border); border-radius: 6px;
	}
	#recipe .step.bypass { opacity: 0.45; }
	#recipe .step .num { width: 20px; height: 20px; border-radius: 50%; background: var(--raised); color: var(--muted); font-size: 11px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
	#recipe .step .kind { width: 80px; font-weight: 600; flex: none; }
	#recipe .params { display: flex; flex-wrap: wrap; gap: 6px 14px; flex: 1; }
	#recipe .params label, #recipe .mixinput label { color: var(--muted); font-size: 12px; display: inline-flex; align-items: center; gap: 5px; }
	#recipe .tools { display: flex; gap: 3px; flex: none; }
	#recipe .mixinput { display: flex; align-items: center; gap: 8px; padding: 4px 8px 4px 40px; flex-wrap: wrap; }
	#recipe .mixinput.bypass { opacity: 0.45; }
	#recipe .mixinput .credit { font-size: 12px; }
	#recipe .mixadd { margin: 2px 0 4px 40px; }
	#recipe .addstep { padding: 4px 14px 14px; }
	#recipe .note { margin: 8px 14px 0; }
	#recipestate, #editstate { font-size: 12.5px; }
	#clips { margin: 0 14px 14px; border-top: 1px solid var(--border); padding-top: 10px; }
	#clips summary { cursor: pointer; color: var(--muted); }
	#clips summary:hover { color: var(--text); }
	#clips p { color: var(--muted); max-width: 900px; }
	#clips .range { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 6px 0; }

	/* Player */
	#player
	{
		grid-area: player; display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: var(--panel);
		border-top: 1px solid var(--border); box-shadow: 0 -6px 18px #0004;
	}
	#play
	{
		width: 44px; height: 44px; border-radius: 50%; padding: 0; font-size: 16px; background: var(--accent); border-color: var(--accent); color: #fff; flex: none;
	}
	#play:hover { background: #6d9bf2; }
	#player .np { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
	#player .np-top { display: flex; gap: 12px; align-items: baseline; }
	#current { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 500; }
	#time { font-variant-numeric: tabular-nums; font-size: 12px; }
	#wave { width: 100%; height: 44px; display: block; cursor: pointer; border-radius: 4px; background: var(--bg); }
	#player .ptools { display: flex; align-items: center; gap: 14px; flex: none; }
</style>
</head>
<body>
<header id="topbar">
	<div class="brand"><span class="logo">&#9835;</span> Audio authoring</div>
	<div id="status">
		<span id="fsstatus"></span>
		<span id="fssetup" hidden>
			<input type="text" id="fsid" placeholder="Freesound client id" size="16"> <input type="text" id="fssecret" placeholder="client secret" size="24">
			<button id="fssave">Save</button>
		</span>
		<span class="muted" id="pending"></span>
		<span id="publish"></span>
		<span id="message"></span>
	</div>
	<button id="apply" hidden>Cook now</button>
</header>
<aside id="sidebar">
	<div class="side-head">
		<input type="search" id="filter" placeholder="Filter sounds..." aria-label="Filter sounds">
		<button id="addsound" class="primary" title="Add a new sound ID to the project's catalog">+ New</button>
	</div>
	<div id="ids"></div>
</aside>
<main id="main">
	<header id="head">
		<h1 id="title">Pick a sound</h1>
		<div id="chips"></div>
		<p id="desc" class="muted"></p>
	</header>
	<details id="soundform" class="card" hidden title="The sound's entry in the project's catalog. Saved changes reach the game after a short pause.">
		<summary>Sound settings</summary>
		<div class="fields">
			<label class="f w2" title="Lower-case dotted name, e.g. 'shore.lapping'. Renaming also renames the sound's preparation file and reference masters, but game code that names the ID must be changed by hand."><span>ID</span><input type="text" id="sf_id"></label>
			<label class="f" title="Pick a section or type a new name; a new section is added at the end of the catalog"><span>Section</span><input type="text" id="sf_section" list="sf_sections"></label>
			<label class="f" title="The mix group whose volume controls this sound"><span>Group</span><input type="text" id="sf_group" list="sf_groups"></label>
			<label class="f" title="Linear gain applied in the game"><span>Gain</span><input type="number" id="sf_gain" min="0" step="0.01"></label>
			<label class="f" title="A bed surrounds the listener. A positioned sound comes from a point in the world, so it must be mono and needs a range."><span>Placement</span><select id="sf_placement"><option value="bed">Bed (surrounds)</option><option value="positioned">Positioned (from a point)</option></select></label>
			<label class="f"><span>Channels</span><select id="sf_channels"><option value="mono">Mono</option><option value="stereo">Stereo</option></select></label>
			<label class="f" title="Distance in metres at which a positioned sound becomes silent"><span>Range (m)</span><input type="number" id="sf_range" min="0" step="0.5"></label>
			<label class="f" title="Memory keeps the whole sound uncompressed in memory, which suits short sounds that play often. Stream decodes compressed (Ogg) audio as it plays, which suits anything long."><span>Load</span><select id="sf_load"><option value="memory">Memory (short sounds)</option><option value="stream">Stream (long sounds)</option></select></label>
			<label class="f" title="Optional expected length range in seconds; leave both blank for none"><span>Length (s)</span><span class="range-pair"><input type="number" id="sf_len_min" min="0" step="0.1" placeholder="min"> to <input type="number" id="sf_len_max" min="0" step="0.1" placeholder="max"></span></label>
			<label class="f check" title="Whether the game repeats the sound"><span>Loops in game</span><input type="checkbox" id="sf_loop"></label>
			<label class="f wide"><span>Description</span><input type="text" id="sf_desc"></label>
		</div>
		<div class="actions">
			<button id="sf_save" class="primary">Save</button>
			<button id="sf_cancel" hidden>Cancel</button>
			<span class="muted" id="sf_active"></span>
			<span class="spacer"></span>
			<button id="sf_delete" class="danger" title="Remove the sound from the catalog and delete its preparation file and reference masters">Delete sound</button>
		</div>
	</details>
	<datalist id="sf_sections"></datalist>
	<datalist id="sf_groups"></datalist>
	<section id="recordings" class="card">
		<div class="card-head"><h2>Recordings</h2></div>
		<table id="list"></table>
		<div id="sources">
			<div class="src">
				<span class="lbl">From Freesound</span>
				<input type="text" id="addnum" placeholder="sound number or page address" size="30">
				<button id="add">Add <span id="addto"></span></button>
			</div>
			<div class="src" id="importrow">
				<span class="lbl">From disk</span>
				<button id="importpick" title="Choose an audio file, or drop one anywhere on this page">Choose file...</button>
				<span class="muted">or drop a file anywhere on this page, to add it <span id="importto"></span></span>
				<input type="file" id="importfile" accept=".wav,.mp3,.flac,.ogg,.opus" hidden>
			</div>
			<div id="importform" hidden>
				<div class="row"><b id="im_file"></b></div>
				<div class="row">
					<label class="wide">Title <input type="text" id="im_title" class="note"></label>
					<label class="wide">Author <input type="text" id="im_author" class="note"></label>
				</div>
				<div class="row">
					<label class="wide">Licence <input type="text" id="im_licence" class="note" placeholder="e.g. CC0, CC-BY 4.0"></label>
					<label class="wide">URL <input type="text" id="im_url" class="note" placeholder="optional"></label>
				</div>
				<div class="row">
					<button id="im_add" class="primary" title="Copy the file into the originals folder, which is kept with the project. Rejecting it later removes the copy again.">Add</button>
					<button id="im_cancel">Cancel</button>
				</div>
			</div>
			<div class="src" id="findrow" hidden>
				<span class="lbl">Search with AI</span>
				<button id="find">Find more candidates</button>
				<span id="findinfo"></span>
			</div>
		</div>
	</section>
	<section id="recipe" class="card" hidden></section>
</main>
<footer id="player">
	<button id="play" title="Play or stop the current sound (Space)">&#9654;</button>
	<div class="np">
		<div class="np-top">
			<span id="current" title="The current sound. Its recipe is shown in the main panel.">Nothing selected</span>
			<span class="muted" id="time"></span>
		</div>
		<canvas id="wave" title="Click or drag to seek. The shaded part is the loop region."></canvas>
	</div>
	<div class="ptools">
		<button id="seam" title="Play the last 3 s running into the loop start, to hear the loop join">Loop seam</button>
		<label class="toggle" title="Repeat playback here. Starts as the selected sound's 'Loops in game' setting."><input type="checkbox" id="loopplay" checked> Repeat</label>
		<label class="toggle" title="Scales playback only, so different recordings can be compared at similar levels. Prepared files are not changed. Turn off to hear the actual prepared gain."><input type="checkbox" id="match"> Match loudness</label>
	</div>
</footer>
<script>
"use strict";

// Review state from the server and the selected sound ID
let state = null;
let sel_id = null;

// The current sound. A slot names what to play rather than a file, so it follows new renders: { origin } for an unassigned recording, or
// { id, variant, view } where 'view' is 'game' (what the game plays), 'render' (the recipe's output), 'reference' (the reference master) or 'original'.
let current = null;

// The variant of the current sound, whose recipe is open, and the recipe being edited. Edits are sent after a short pause.
let edit = null;
let edit_recipe = null;
let edit_timer = null;
const EDIT_DELAY_MS = 600;

// Unsubmitted original-time ranges belong to the variant whose recipe is open.
let clip_ranges = [];

// Audio graph: one source plays at a time through a gain that applies playback-only loudness matching
const ctx = new AudioContext();
const gain = ctx.createGain();
gain.connect(ctx.destination);
const buffers = new Map();
let source = null;
let source_url = null;
let waiting = false;
let started_at = 0;
let offset = 0;
let seam_timer = null;
let poll_timer = null;
let state_json = null;
let render_deferred = false;

// The sound form adds a new sound when 'adding' is true, otherwise it edits the selected sound. It is filled only when the selection or mode changes,
// because the state is redrawn while polling and must not overwrite unsaved typing.
let adding = false;

// The pseudo ID that selects the pool of unassigned recordings
const POOL = "(unassigned)";

// Recipe step kinds, their parameters, display names for parameters whose recipe key is unclear, and the values a new step starts with
const STEPS = {
	trim: { label: "Trim", params: { start: "s", end: "s" }, init: { start: 0 } },
	cut: { label: "Cut", params: { start: "s", end: "s" }, init: { start: 0, end: 1 } },
	fade_in: { label: "Fade in", params: { duration: "s", curve: "curve" }, init: { duration: 0.5, curve: "sine" } },
	fade_out: { label: "Fade out", params: { duration: "s", curve: "curve" }, init: { duration: 0.5, curve: "sine" } },
	gain: { label: "Gain", params: { db: "dB" }, init: { db: 0 } },
	loudness: { label: "Loudness", params: { lufs: "LUFS" }, init: { lufs: -23 } },
	high_pass: { label: "High-pass", params: { frequency: "Hz", slope: "slope" }, init: { frequency: 80, slope: 12 } },
	low_pass: { label: "Low-pass", params: { frequency: "Hz", slope: "slope" }, init: { frequency: 12000, slope: 12 } },
	eq: { label: "EQ", params: { frequency: "Hz", db: "dB", q: "Q" }, init: { frequency: 1000, db: 0, q: 1 } },
	denoise: { label: "Denoise", params: { start: "s", end: "s", db: "dB" }, init: { start: 0, end: 0.5, db: 12 } },
	loop: { label: "Loop", params: { duration: "s", start: "s" }, names: { duration: "crossfade", start: "loop start" }, init: { duration: 3 } },
	mix: { label: "Mix", params: { db: "dB" }, init: { db: 0, inputs: [] } },
};

// Apply a new state from the server, then poll while background work or publishing is pending, or while an external editor may export an edit.
// A polled state redraws only when it changed, and waits while a dropdown has focus, because a redraw replaces the dropdown and closes its open list.
function adopt_state(s, polled = false)
{
	// Redraw now, or leave it for the focusout handler below
	const json = JSON.stringify(s);
	const changed = json !== state_json;
	state = s;
	state_json = json;
	if (!polled)
		render();
	else if (changed && document.activeElement?.tagName === "SELECT")
		render_deferred = true;
	else if (changed)
		render();

	follow_live_url();
	clearTimeout(poll_timer);
	if (state.pending.length || state.publish.waiting.length || state.publish.running.length)
		poll_timer = setTimeout(() => refresh(true), 500);
	else if (Object.values(state.preps).flat().some(v => v.edit))
		poll_timer = setTimeout(() => refresh(true), 1000);
}

// Apply a redraw that a polled state deferred while a dropdown was open
document.addEventListener("focusout", e =>
{
	// Redraw after the focus change completes, so the redraw doesn't fight the element taking focus
	if (!render_deferred || e.target.tagName !== "SELECT")
		return;

	render_deferred = false;
	setTimeout(render);
});

// Fetch the current state. 'polled' marks a background poll rather than a fetch after a user action.
async function refresh(polled = false)
{
	const r = await fetch("/api/state");
	adopt_state(await r.json(), polled);
}

// Send one action to the server; the reply carries the new state and a notice or error, and is returned so callers can follow up on success
async function post(body)
{
	const r = await fetch("/api/state", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
	const s = await r.json();
	adopt_state(s);
	show_message(s.error ?? s.notice ?? "", !!s.error);
	return s;
}

function show_message(text, is_error)
{
	const el = document.getElementById("message");
	el.textContent = text;
	el.className = is_error ? "error" : "muted";
}

// The variants of a sound ID, in saved order
function variants_of(id)
{
	return state.preps[id] ?? [];
}

function variant_of(id, variant_id)
{
	return variants_of(id).find(v => v.id === variant_id) ?? null;
}

// The address a slot plays now, or null
function url_of(slot)
{
	if (!slot)
		return null;

	if (slot.origin)
		return state.origins[slot.origin]?.play ?? null;

	const v = variant_of(slot.id, slot.variant);
	if (!v)
		return null;

	// The game plays the reference master or else the recipe's render. Only a variant that is not imported yet falls back to its preview.
	const original = state.origins[v.origin]?.play ?? null;
	switch (slot.view)
	{
		case "game": return v.reference_url ?? v.render_url ?? (v.source ? null : original);
		case "render": return v.render_url;
		case "reference": return v.reference_url;
		case "original": return original;
		default: throw new Error("Unknown view " + slot.view);
	}
}

// Decode a file once, remembering its RMS level for playback-only loudness matching and its peaks for the waveform display.
// Concurrent requests for the same file share one decode.
const WAVE_SLICES = 1200;
const decoding = new Map();
async function buffer_for(url)
{
	// Finished decodes are kept in 'buffers'; decodes in progress in 'decoding'
	if (buffers.has(url))
		return buffers.get(url);

	if (!decoding.has(url))
		decoding.set(url, decode(url).finally(() => decoding.delete(url)));

	return decoding.get(url);
}

// Decode one file into a 'buffers' entry; see buffer_for
async function decode(url)
{
	// Read the loop start before decoding, because decoding takes ownership of the bytes and ignores the 'smpl' chunk
	const data = await (await fetch(url)).arrayBuffer();
	const loop_start = wav_loop_start(data);
	const buf = await ctx.decodeAudioData(data);
	let sum = 0, n = 0;
	for (let c = 0; c != buf.numberOfChannels; ++c)
	{
		const d = buf.getChannelData(c);
		for (let i = 0; i < d.length; i += 4) { sum += d[i] * d[i]; ++n; }
	}

	// The loudest sample of each of a fixed number of slices, over all channels, normalised so quiet sounds are still visible
	const peaks = new Float32Array(WAVE_SLICES);
	const per_slice = Math.max(1, Math.floor(buf.length / WAVE_SLICES));
	for (let c = 0; c != buf.numberOfChannels; ++c)
	{
		const d = buf.getChannelData(c);
		for (let s = 0; s != WAVE_SLICES; ++s)
		{
			const end = Math.min(d.length, (s + 1) * per_slice);
			for (let i = s * per_slice; i < end; i += 2)
				peaks[s] = Math.max(peaks[s], Math.abs(d[i]));
		}
	}
	const top = Math.max(...peaks) || 1;
	for (let s = 0; s != WAVE_SLICES; ++s)
		peaks[s] /= top;

	const entry = { buf, loop_start, peaks, rms: Math.sqrt(sum / Math.max(n, 1)) || 1e-6 };
	buffers.set(url, entry);
	return entry;
}

// Draw the play state on the transport button
function show_playing(on)
{
	const b = document.getElementById("play");
	b.innerHTML = on ? "&#9632;" : "&#9654;";
	b.title = (on ? "Stop" : "Play") + " the current sound (Space)";
}

// The loop start in seconds from a WAV file's 'smpl' chunk, or null when the file has none (then the whole sound loops) or is not a WAV file
function wav_loop_start(data)
{
	// Walk the RIFF chunks, noting the sample rate from 'fmt ' and the first loop's start frame from 'smpl'
	const view = new DataView(data);
	if (view.byteLength < 12 || view.getUint32(0, false) !== 0x52494646 || view.getUint32(8, false) !== 0x57415645)
		return null;

	let rate = 0, start = null;
	for (let at = 12; at + 8 <= view.byteLength; )
	{
		// Chunks are padded to an even size
		const id = view.getUint32(at, false);
		const size = view.getUint32(at + 4, true);
		if (id === 0x666d7420 && size >= 8)
			rate = view.getUint32(at + 12, true);
		else if (id === 0x736d706c && size >= 36 + 24 && view.getUint32(at + 8 + 28, true) > 0)
			start = view.getUint32(at + 8 + 36 + 8, true);

		at += 8 + size + (size & 1);
	}
	return rate && start !== null ? start / rate : null;
}

// Map a playback time that may have repeated past the end onto the position in the sound. Only the region from the loop start to the end repeats.
function wrap_time(entry, t)
{
	// Before the end the time is the position; after it, the time cycles through the loop region
	const duration = entry.buf.duration;
	if (t < duration)
		return t;

	const loop_start = entry.loop_start ?? 0;
	return loop_start + (t - duration) % (duration - loop_start);
}

function position()
{
	return source ? offset + (ctx.currentTime - started_at) : offset;
}

function stop()
{
	clearTimeout(seam_timer);
	waiting = false;
	if (source)
	{
		offset = position();
		source.onended = null;
		source.stop();
		source = null;
	}
	show_playing(false);
}

// Start the current sound at the shared position. Playback repeats when 'Loop playback' is on or 'force_loop' is set; otherwise it stops at the end.
// A sound whose audio is still rendering waits, and starts when the render arrives.
async function start(at, force_loop)
{
	stop();
	const url = url_of(current);
	waiting = !url && is_rendering(current);
	if (!url)
	{
		show_playing(waiting);
		render_player();
		return;
	}

	const entry = await buffer_for(url);
	const { buf, rms } = entry;
	await ctx.resume();
	stop();
	gain.gain.value = document.getElementById("match").checked ? Math.min(0.1 / rms, 8) : 1;
	source = ctx.createBufferSource();
	source.buffer = buf;
	source.loop = !!force_loop || document.getElementById("loopplay").checked;
	if (entry.loop_start !== null)
	{
		// Repeat only the loop region, as the game does
		source.loopStart = entry.loop_start;
		source.loopEnd = buf.duration;
	}
	source.onended = () =>
	{
		// Playback reached the end without looping, so return to the start ready to play again
		source = null;
		offset = 0;
		show_playing(false);
		render_player();
	};
	source.connect(gain);
	source_url = url;
	offset = wrap_time(entry, at ?? offset);
	started_at = ctx.currentTime;
	source.start(0, offset);
	show_playing(true);
	render_player();
}

// When a new render replaces what is playing, or arrives for a sound waiting to play, switch to it at the same position, so recipe edits are heard straight away
function follow_live_url()
{
	if ((source || waiting) && url_of(current) !== source_url)
		start(position());
}

// Play the end of the current sound running into its loop start to hear the loop join
async function seam()
{
	const url = url_of(current);
	if (!url)
		return;

	const { buf } = await buffer_for(url);
	await start(Math.max(buf.duration - 3, 0), true);
	seam_timer = setTimeout(stop, 6000);
}

// Make 'slot' the current sound, and play it from the shared position when 'play' is set. The recipe editor follows the current sound's variant.
function set_current(slot, play)
{
	// A different variant opens its own recipe, after sending any waiting edit of the previous one
	const variant = slot && !slot.origin ? { id: slot.id, variant: slot.variant } : null;
	if (variant?.id !== edit?.id || variant?.variant !== edit?.variant)
	{
		flush_recipe();
		edit = variant;
		edit_recipe = structuredClone((edit && variant_of(edit.id, edit.variant)?.recipe) ?? []);
		clip_ranges = [];
	}
	current = slot;

	// Switching keeps the playback position, so views of one variant can be compared at the same point
	if (play)
		start(position());
	else
		stop();

	render_recipe();
	render();
}

function origin_label(origin)
{
	const o = state.origins[origin];
	return o ? `${o.title ?? origin} (${o.user ?? "?"}, ${o.licence ?? "?"})` : origin;
}

const VIEW_NAMES = { game: "", render: "recipe output", reference: "reference master", original: "original" };

// The transport's description of a slot: the sound and variant, the recording, and which view of it plays
function player_label(slot)
{
	// An unassigned recording has no sound ID or variant
	if (!slot)
		return `<span class="muted">Nothing selected</span>`;

	if (slot.origin)
		return `${esc(origin_label(slot.origin))} <span class="muted">unassigned</span>`;

	const v = variant_of(slot.id, slot.variant);
	const view = VIEW_NAMES[slot.view] ? ` <span class="chip">${VIEW_NAMES[slot.view]}</span>` : "";
	return `<b>${esc(slot.id)}</b> <span class="muted">${esc(slot.variant)}</span> &nbsp;${v ? esc(origin_label(v.origin)) : ""}${view}`;
}

// The name cell of an origin: Freesound recordings link to their page. An edit is named like the recording it was made from.
function name_html(origin)
{
	const o = state.origins[origin] ?? {};
	const credit = `<span class="muted">${esc(o.user ?? "")} &middot; ${esc(o.licence ?? "")}</span>`;
	const title = esc(o.title ?? origin) + (o.edit_of ? ` <span class="muted">(edited)</span>` : "");
	const link = o.url ? `<a href="${esc(o.url)}" target="_blank">${esc((o.edit_of ?? origin).split(":")[1])}</a> ` : "";
	const import_state = o.import_pending ? ` <span class="muted">importing...</span>` : o.import_error ? ` <span class="error" title="${esc(o.import_error)}">import failed</span>` : "";
	return `${link}${title} ${credit}${import_state}`;
}

function esc(text)
{
	return String(text).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

function render_player()
{
	const el = document.getElementById("current");
	const note = availability(current);
	el.innerHTML = player_label(current) + (note ? ` <span class="warn">${note}</span>` : "");
}

// Files the transport could not decode, so it does not fetch them again on every redraw
const wave_failed = new Set();

// Draw the playback position over the waveform of the sound that plays now, or of the current sound when stopped.
// The loop region is shaded, because only it repeats.
function draw_transport()
{
	// Match the canvas resolution to its displayed size so the waveform stays sharp
	const cv = document.getElementById("wave");
	const dpr = window.devicePixelRatio || 1;
	const w = Math.round(cv.clientWidth * dpr), h = Math.round(cv.clientHeight * dpr);
	if (cv.width !== w || cv.height !== h)
	{
		cv.width = w;
		cv.height = h;
	}
	const g = cv.getContext("2d");
	g.clearRect(0, 0, w, h);

	// Without decoded audio there is only a centre line; decoding starts so the waveform appears shortly
	const url = source ? source_url : url_of(current);
	const entry = url && buffers.get(url);
	const time = document.getElementById("time");
	if (!entry)
	{
		if (url && !wave_failed.has(url))
			buffer_for(url).catch(() => wave_failed.add(url));

		g.fillStyle = "#31353c";
		g.fillRect(0, h / 2 - dpr / 2, w, dpr);
		time.textContent = "";
		return;
	}

	// The loop region, when the file names one, is shaded with a marker at its start
	const duration = entry.buf.duration;
	const t = wrap_time(entry, position());
	if (entry.loop_start !== null)
	{
		const x = w * entry.loop_start / duration;
		g.fillStyle = "#e5b04a18";
		g.fillRect(x, 0, w - x, h);
		g.fillStyle = "#e5b04a";
		g.fillRect(x, 0, dpr, h);
	}

	// Bars, brighter for the part already played
	const bar = 2 * dpr, gap = dpr, played = w * t / duration;
	for (let x = 0; x < w; x += bar + gap)
	{
		// Each bar shows the loudest slice it covers
		const s0 = Math.floor(WAVE_SLICES * x / w), s1 = Math.max(s0 + 1, Math.floor(WAVE_SLICES * (x + bar) / w));
		let peak = 0;
		for (let s = s0; s < s1 && s < WAVE_SLICES; ++s)
			peak = Math.max(peak, entry.peaks[s]);

		const bh = Math.max(dpr, peak * (h - 4 * dpr));
		g.fillStyle = x < played ? "#5b8def" : "#4a505a";
		g.fillRect(x, (h - bh) / 2, bar, bh);
	}

	// The playhead
	g.fillStyle = "#e3e6ea";
	g.fillRect(played, 0, dpr, h);
	time.textContent = `${t.toFixed(1)} / ${duration.toFixed(1)} s`;
}

// True when the slot's audio is a render still in progress
function is_rendering(slot)
{
	// Only recipe output renders; reference masters and originals are files already
	const v = slot && !slot.origin ? variant_of(slot.id, slot.variant) : null;
	return !!v && (slot.view === "game" || slot.view === "render") && v.render_pending && !url_of(slot);
}

// A note for a slot that cannot play now
function availability(slot)
{
	if (!slot || url_of(slot))
		return "";

	return is_rendering(slot) ? "(rendering...)" : "(not available)";
}

// The origins with no live variant anywhere, split by whether they are marked not useful. A recording that a live edit was made from counts as used.
function pool_origins()
{
	const live = Object.values(state.preps).flat().filter(v => v.status !== "rejected");
	const mixed = live.flatMap(v => (v.recipe ?? []).flatMap(s => s.inputs ?? [])).map(x => x.origin);
	const used = new Set([...live.map(v => v.origin), ...mixed, ...live.map(v => state.origins[v.origin]?.edit_of).filter(o => o)]);
	const origins = Object.keys(state.origins).filter(o => !used.has(o));
	return { open: origins.filter(o => !state.origins[o].not_useful), not_useful: origins.filter(o => state.origins[o].not_useful) };
}

// Draw the ID list with counts of accepted, unheard and live variants
function render_ids()
{
	const el = document.getElementById("ids");
	el.innerHTML = "";
	const filter = document.getElementById("filter").value.trim().toLowerCase();
	const badge = (cls, text, title) => `<span class="badge${cls ? " " + cls : ""}" title="${title}">${text}</span>`;

	// The unassigned pool comes first, as it is where new finds wait to be given a use
	const pool = pool_origins();
	const p = document.createElement("div");
	p.className = "id pool" + (sel_id === POOL ? " sel" : "");
	p.innerHTML = `<span>Unassigned</span><span class="badges">${pool.open.length ? badge("new", pool.open.length, "To sort") : ""}${badge("", pool.open.length + pool.not_useful.length, "Recordings in the pool")}</span>`;
	p.onclick = () => select_id(POOL);
	el.appendChild(p);

	// Sections keep their catalog order; the IDs within each section are alphabetical so a sound is easy to find.
	// The filter matches the ID or the section name.
	const section_order = [...new Set(state.ids.map(x => x.section))];
	const ordered = [...state.ids]
		.filter(x => !filter || x.id.toLowerCase().includes(filter) || x.section.toLowerCase().includes(filter))
		.sort((a, b) => section_order.indexOf(a.section) - section_order.indexOf(b.section) || a.id.localeCompare(b.id));
	let section = null;
	for (const { id, section: sec } of ordered)
	{
		if (sec !== section)
		{
			section = sec;
			const h = document.createElement("h3");
			h.textContent = sec;
			el.appendChild(h);
		}
		const mine = variants_of(id).filter(v => v.status !== "rejected");
		const unheard = mine.filter(v => v.status === "unheard").length;
		const accepted = mine.filter(v => v.status === "accepted").length;

		// A sound is final when it has accepted variants, all of them finalised, and no candidates still to decide
		const final = mine.length !== 0 && mine.every(v => v.status === "accepted" && v.finalised);
		const d = document.createElement("div");
		d.className = "id" + (id === sel_id ? " sel" : "") + (final ? " final" : "");
		d.title = final ? "Finalised: every accepted variant has been heard through and needs no more work" : "";
		d.innerHTML = `<span>${esc(id)}</span><span class="badges">${accepted ? badge("good", "&#10003; " + accepted, "Accepted") : ""}${unheard ? badge("new", unheard + " new", "Not listened to yet") : ""}${badge("", mine.length, "Live variants")}</span>`;
		d.onclick = () => select_id(id);
		el.appendChild(d);
	}
	if (filter && ordered.length === 0)
		el.insertAdjacentHTML("beforeend", `<div class="empty">No sound matches '${esc(filter)}'</div>`);
}

// Select an ID (or the unassigned pool) and clear the player and recipe editor
function select_id(id)
{
	flush_recipe();
	sel_id = id;
	current = null;
	edit = null;
	adding = false;
	stop();
	offset = 0;
	document.getElementById("loopplay").checked = state.ids.find(x => x.id === id)?.loop ?? true;
	render();
	render_recipe();
	fill_form(state.ids.find(x => x.id === id) ?? null);
}

// Open the form for a new sound, with defaults suited to a looping ambient bed in the selected sound's section
function start_add()
{
	const section = state.ids.find(x => x.id === sel_id)?.section ?? state.ids.at(-1)?.section ?? "";
	adding = true;
	fill_form({ id: "", section, placement: "bed", channels: "stereo", loop: true, load: "stream", group: "", gain: 1.0 });
	document.getElementById("soundform").open = true;
	render_list();
	document.getElementById("sf_id").focus();
}

// Put a catalog entry into the sound form. The 'priority', 'active' and 'retrigger' values have no editor, so they are kept from the entry and sent back unchanged.
let form_active = undefined;
let form_retrigger = undefined;
let form_priority = undefined;
function fill_form(info)
{
	// Fields default to blank when there is no entry
	const f = id => document.getElementById(id);
	f("sf_id").value = info?.id ?? "";
	f("sf_section").value = info?.section ?? "";
	f("sf_group").value = info?.group ?? "";
	f("sf_gain").value = info?.gain ?? 1;
	f("sf_placement").value = info?.placement ?? "bed";
	f("sf_channels").value = info?.channels ?? "stereo";
	f("sf_range").value = info?.range_m ?? "";
	f("sf_loop").checked = !!info?.loop;
	f("sf_load").value = info?.load ?? "stream";
	f("sf_len_min").value = info?.length_s?.[0] ?? "";
	f("sf_len_max").value = info?.length_s?.[1] ?? "";
	f("sf_desc").value = info?.description ?? "";
	form_active = info?.active;
	form_retrigger = info?.retrigger;
	form_priority = info?.priority;
	f("sf_active").textContent = [form_priority !== undefined ? `priority: ${form_priority}` : "", form_active ? `active: ${JSON.stringify(form_active)}` : "", form_retrigger ? `retrigger: ${JSON.stringify(form_retrigger)}` : ""].filter(x => x).join(" ");
	update_form();
}

// Keep the form consistent with the placement: a positioned sound is mono and has a range, while a bed has no range
function update_form()
{
	const positioned = document.getElementById("sf_placement").value === "positioned";
	const channels = document.getElementById("sf_channels");
	if (positioned)
		channels.value = "mono";

	channels.disabled = positioned;
	document.getElementById("sf_range").disabled = !positioned;
	document.getElementById("sf_save").textContent = adding ? "Add" : "Save";
	document.getElementById("sf_cancel").hidden = !adding;
	document.getElementById("sf_delete").hidden = adding;
}

// The catalog entry described by the form. Optional values are left out when blank, and the server checks the rest.
function form_sound()
{
	// Required values
	const f = id => document.getElementById(id);
	const positioned = f("sf_placement").value === "positioned";
	const sound = {
		id: f("sf_id").value.trim(),
		placement: f("sf_placement").value,
		loop: f("sf_loop").checked,
		channels: positioned ? "mono" : f("sf_channels").value,
		load: f("sf_load").value,
		group: f("sf_group").value.trim(),
		gain: Number(f("sf_gain").value),
	};

	// Optional values; a length with only one end given is taken as a fixed length
	const min = f("sf_len_min").value, max = f("sf_len_max").value;
	if (min !== "" || max !== "")
		sound.length_s = [Number(min !== "" ? min : max), Number(max !== "" ? max : min)];
	if (positioned)
		sound.range_m = Number(f("sf_range").value);
	if (form_priority !== undefined)
		sound.priority = form_priority;
	if (form_active)
		sound.active = form_active;
	if (form_retrigger)
		sound.retrigger = form_retrigger;
	if (f("sf_desc").value.trim())
		sound.description = f("sf_desc").value.trim();

	return { section: f("sf_section").value.trim(), sound };
}

// Add or save the sound in the form, confirming a rename because game code that names the old ID will no longer find it
async function save_form()
{
	// A new sound is added; an existing one is replaced, possibly under a new ID
	const { section, sound } = form_sound();
	let s;
	if (adding)
	{
		s = await post({ action: "add_sound", section, sound });
	}
	else
	{
		if (sound.id !== sel_id && !confirm(`Rename '${sel_id}' to '${sound.id}'?\n\nIts preparation file and reference masters are renamed too. Game code that names '${sel_id}' must be changed by hand.`))
			return;

		s = await post({ action: "edit_sound", id: sel_id, section, sound });
	}

	// On success, show the saved sound so the form holds what the catalog now says
	if (!s.error)
		select_id(sound.id);
}

// Delete the selected sound after confirming what is lost
async function delete_form()
{
	// Version control is the only way back, so the confirmation lists everything removed
	const id = sel_id;
	if (!confirm(`Delete '${id}'?\n\nThis removes it from the catalog and deletes its preparation file and the reference masters that no other sound uses. Game code that names '${id}' will break.`))
		return;

	const s = await post({ action: "delete_sound", id });
	if (!s.error)
		select_id(null);
}

// Draw the unassigned pool: recordings to listen to and either assign to an ID or mark not useful
function render_pool(t)
{
	const pool = pool_origins();
	for (const [text, origins] of [[`To sort (${pool.open.length})`, pool.open], [`Not useful (${pool.not_useful.length})`, pool.not_useful]])
	{
		// Each part has its own heading so not-useful recordings can still be found and restored
		const h = document.createElement("tr");
		h.className = "section";
		h.innerHTML = `<th colspan="4">${text}</th>`;
		t.appendChild(h);
		const cols = document.createElement("tr");
		cols.className = "cols";
		cols.innerHTML = "<th></th><th>Recording</th><th>Earlier decisions</th><th>Assign to</th>";
		t.appendChild(cols);
		for (const o of origins)
			t.appendChild(render_pool_row(o));
		if (!origins.length)
			add_empty(t, 4, "None");
	}
}

// Build the row for one unassigned recording
function render_pool_row(origin)
{
	// Not-useful rows are dimmed; the current sound's row is marked
	const o = state.origins[origin];
	const tr = document.createElement("tr");
	tr.className = "row" + (o.not_useful ? " rejected" : "") + (current?.origin === origin ? " current" : "");

	// Play it, and toggle whether it is useful
	const td_play = document.createElement("td");
	td_play.appendChild(icon_button("\u25B6", "Play", () => set_current({ origin }, true)));
	const nu = button("Not useful", "Hide from the list of recordings to sort", () => post({ action: "useful", origin, useful: !!o.not_useful }));
	nu.className = o.not_useful ? "on" : "";
	td_play.appendChild(nu);
	tr.appendChild(td_play);

	const td_name = document.createElement("td");
	td_name.className = "rec";
	td_name.innerHTML = name_html(origin);
	tr.appendChild(td_name);

	// Earlier rejections, so the same use is not tried again
	const td_earlier = document.createElement("td");
	td_earlier.className = "muted";
	td_earlier.textContent = Object.entries(state.preps).flatMap(([id, vs]) => vs.filter(v => v.origin === origin).map(v => `rejected for ${id}${v.note ? " (" + v.note + ")" : ""}`)).join("; ");
	tr.appendChild(td_earlier);

	// Give the recording a possible use; it then leaves the pool
	const td_assign = document.createElement("td");
	td_assign.appendChild(id_select([], id => post({ action: "assign", id, origin }), "Assign to..."));
	tr.appendChild(td_assign);
	return tr;
}

// Draw the variants of the selected ID: accepted ones in runtime order, then the candidates in their saved order. Rejected variants are hidden;
// they remain as rejection history and appear under Unassigned when they have no other use.
function render_list()
{
	const t = document.getElementById("list");
	t.innerHTML = "";
	const target = sel_id && sel_id !== POOL ? `to ${sel_id}` : "to the unassigned pool";
	document.getElementById("addto").textContent = target;
	document.getElementById("importto").textContent = target;
	render_head();

	// The form shows while adding or when a sound is selected; its choice lists follow the catalog
	const sound = state.ids.find(x => x.id === sel_id);
	document.getElementById("soundform").hidden = !adding && !sound;
	document.getElementById("recordings").hidden = adding || !sel_id;
	document.getElementById("sf_sections").innerHTML = [...new Set(state.ids.map(x => x.section))].map(x => `<option value="${esc(x)}">`).join("");
	document.getElementById("sf_groups").innerHTML = [...new Set(state.ids.map(x => x.group))].sort().map(x => `<option value="${esc(x)}">`).join("");
	if (!sel_id || adding)
		return;

	if (sel_id === POOL)
	{
		render_pool(t);
		return;
	}

	const variants = variants_of(sel_id);
	const accepted = variants.filter(v => v.status === "accepted");
	const others = variants.filter(v => v.status !== "accepted" && v.status !== "rejected");
	add_section(t, `Accepted &middot; ${accepted.length} &middot; runtime order`);
	accepted.forEach((v, i) => t.appendChild(render_row(v, i, accepted.length)));
	if (!accepted.length)
		add_empty(t, 3, "Nothing accepted yet. Accept a candidate to use it in the game.");

	add_section(t, `Candidates &middot; ${others.length}`, others.some(v => !v.source) ? button("Import originals", "Fetch the original recordings of the candidates, so their recipes can be edited", () => post({ action: "prepare", id: sel_id, import: true })) : null);
	others.forEach(v => t.appendChild(render_row(v, -1, 0)));
	if (!others.length)
		add_empty(t, 3, "No candidates. Add recordings below.");
}

// The page heading: the sound's ID, a summary of its catalog settings and its description
function render_head()
{
	// The title names what the main panel shows
	const sound = state.ids.find(x => x.id === sel_id);
	document.getElementById("title").textContent = adding ? "New sound" : sel_id === POOL ? "Unassigned recordings" : (sel_id ?? "Pick a sound");

	// Chips summarise the settings that matter when listening, so the settings card can stay closed
	const chips = [];
	const chip = (k, v) => chips.push(`<span class="chip">${k ? `<span class="muted">${k}</span> ` : ""}${esc(String(v))}</span>`);
	if (sound && !adding)
	{
		chip("", sound.section);
		if (sound.group)
			chip("group", sound.group);

		chip("", sound.placement === "positioned" ? `positioned${sound.range_m ? " \u00B7 " + sound.range_m + " m" : ""}` : "bed");
		chip("", sound.channels);
		chip("", sound.loop ? "\u21BB loops" : "one-shot");
		chip("", sound.load);
		if (sound.gain !== undefined && sound.gain !== 1)
			chip("gain", sound.gain);
	}
	document.getElementById("chips").innerHTML = chips.join("");

	// The description explains what the sound is for; the pool and the add form have their own help
	const desc = document.getElementById("desc");
	desc.textContent =
		adding ? "Describe the new sound below. Recordings can be added once it is saved." :
		sel_id === POOL ? "Recordings with no use yet. Listen to them, then assign each to a sound or mark it not useful." :
		!sel_id ? "Choose a sound from the list on the left, or add a new one." :
		(sound?.description ?? "");
}

// A placeholder row for an empty list section
function add_empty(t, columns, text)
{
	const tr = document.createElement("tr");
	tr.innerHTML = `<td colspan="${columns}" class="empty">${text}</td>`;
	t.appendChild(tr);
}

// Add a section heading and column headings to the list
function add_section(t, text, extra)
{
	const h = document.createElement("tr");
	h.className = "section";
	h.innerHTML = `<th colspan="3">${text} </th>`;
	if (extra)
		h.firstChild.appendChild(extra);

	t.appendChild(h);
	const cols = document.createElement("tr");
	cols.className = "cols";
	cols.innerHTML = "<th></th><th>Recording</th><th>Decision</th>";
	t.appendChild(cols);
}

function button(text, title, onclick)
{
	const b = document.createElement("button");
	b.textContent = text;
	b.title = title;
	b.onclick = onclick;
	return b;
}

// A small square button showing a symbol; 'ghost' draws it without a frame until hovered
function icon_button(text, title, onclick, ghost = false)
{
	const b = button(text, title, onclick);
	b.className = "icon" + (ghost ? " ghost" : "");
	return b;
}

// A sound ID picker that calls 'pick' with the chosen ID, leaving out 'exclude'. 'prompt' is the text shown before a choice is made.
function id_select(exclude, pick, prompt = "...")
{
	const sel = document.createElement("select");
	sel.innerHTML = `<option value=''>${esc(prompt)}</option>` + state.ids.map(x => x.id).filter(x => !exclude.includes(x)).sort().map(x => `<option>${esc(x)}</option>`).join("");
	sel.onchange = () => { if (sel.value) pick(sel.value); };
	return sel;
}

// Build the row for one variant. 'index' and 'count' place accepted variants in runtime order; candidates have index -1.
function render_row(v, index, count)
{
	// Rows are styled by status; the current sound's row is marked
	const tr = document.createElement("tr");
	const is_current = !!edit && edit.id === sel_id && edit.variant === v.id;
	tr.className = "row " + v.status + (is_current ? " current" : "");

	// Accepted variants move within the runtime order; the arrows stack to keep the column narrow
	const td_play = document.createElement("td");
	if (v.status === "accepted")
	{
		const order = document.createElement("span");
		order.className = "order";
		for (const [text, delta] of [["\u25B2", -1], ["\u25BC", 1]])
		{
			const mv = icon_button(text, delta < 0 ? "Earlier in runtime order" : "Later in runtime order", () => post({ action: "move", id: sel_id, variant: v.id, delta }), true);
			mv.disabled = delta < 0 ? index === 0 : index === count - 1;
			order.appendChild(mv);
		}
		td_play.appendChild(order);
	}

	// Play what the game would play; listening to an unheard variant makes it a candidate
	td_play.appendChild(icon_button("\u25B6", "Play what the game plays, and show its recipe", () =>
	{
		if (v.status === "unheard")
			post({ action: "status", id: sel_id, variant: v.id, status: "candidate" });

		set_current({ id: sel_id, variant: v.id, view: "game" }, true);
	}));

	// Show this variant's recipe without playing it
	const e = button("\u270E Recipe", "Show how this variant is prepared, without playing it", () =>
	{
		if (!is_current)
			set_current({ id: sel_id, variant: v.id, view: "game" }, false);

		document.getElementById("recipe").scrollIntoView({ behavior: "smooth", block: "start" });
	});
	e.className = v.recipe?.length ? "on" : "";
	td_play.appendChild(e);
	tr.appendChild(td_play);

	// The recording, with the state of its preparation
	const td_name = document.createElement("td");
	td_name.className = "rec";
	const prep_state = v.render_pending ? ` <span class="muted">rendering...</span>` : v.render_error ? ` <span class="error" title="${esc(v.render_error)}">render failed</span>` : "";
	const reference = v.reference_master ? ` <span class="warn" title="The game plays ${esc(v.reference_master)} until the recipe is edited">reference master</span>` : "";
	const unheard = v.status === "unheard" ? ` <span class="badge new">new</span>` : "";
	td_name.innerHTML = `<span class="vid">${esc(v.id)}</span>${name_html(v.origin)}${unheard}${reference}${prep_state}`;
	tr.appendChild(td_name);

	// Status buttons; several variants can be accepted for one ID. The decision, note and reuse controls share one cell so they wrap in narrow windows.
	const td_status = document.createElement("td");
	const box = document.createElement("div");
	box.className = "decide";
	td_status.appendChild(box);
	const seg = document.createElement("span");
	seg.className = "seg status";
	for (const st of ["accepted", "candidate", "rejected"])
	{
		const b = button(st[0].toUpperCase() + st.slice(1), "", () =>
		{
			// A rejected recording is no longer worth hearing, so stop it if it is the one playing
			if (st === "rejected" && current && !current.origin && current.id === sel_id && current.variant === v.id)
				stop();

			post({ action: "status", id: sel_id, variant: v.id, status: st });
		});
		b.className = v.status === st ? `on s-${st}` : "";
		seg.appendChild(b);
	}
	box.appendChild(seg);

	// Finalised is separate from status: it marks a variant that has been heard all the way through and needs no more work
	const fin = button("\u2713 Finalised", "Listened to all the way through, and happy with it", () => post({ action: "finalised", id: sel_id, variant: v.id, finalised: !v.finalised }));
	fin.className = "fin" + (v.finalised ? " on" : "");
	box.appendChild(fin);

	// A free note about the variant
	const note = document.createElement("input");
	note.type = "text";
	note.className = "note";
	note.placeholder = "Add a note";
	note.value = v.note ?? "";
	note.onchange = () => post({ action: "note", id: sel_id, variant: v.id, note: note.value });
	box.appendChild(note);

	// Assign the same recording to another ID. IDs it is already live for are left out.
	const taken = Object.entries(state.preps).filter(([, vs]) => vs.some(x => x.origin === v.origin && x.status !== "rejected")).map(([id]) => id);
	box.appendChild(id_select(taken, id => post({ action: "assign", id, origin: v.origin }), "Also try for..."));
	tr.appendChild(td_status);
	return tr;
}

// Draw the recipe editor. It is redrawn only for structural changes, so typing in a parameter keeps focus.
function render_recipe()
{
	const el = document.getElementById("recipe");
	const v = edit && variant_of(edit.id, edit.variant);
	el.hidden = !v;
	el.innerHTML = "";
	if (!v)
		return;

	// Heading, preparation state and the listening choices for this variant
	const head = document.createElement("div");
	head.className = "card-head";
	head.innerHTML = `<h2>Recipe</h2><span class="sub">${esc(edit.id)} &middot; ${esc(v.id)} &middot; ${esc(origin_label(v.origin))}</span><span class="spacer"></span>`;
	const edit_info = document.createElement("span");
	edit_info.id = "editstate";
	head.appendChild(edit_info);
	const info = document.createElement("span");
	info.id = "recipestate";
	head.appendChild(info);
	el.appendChild(head);

	// Each view of this variant plays in place of the current one; the view playing now is marked
	const bar = document.createElement("div");
	bar.className = "listen";
	bar.insertAdjacentHTML("beforeend", `<span class="lbl">Listen to</span>`);
	const views = document.createElement("span");
	views.className = "seg";
	const view_button = (text, view, title) =>
	{
		// The marked view is the one the transport plays now
		const b = button(text, title, () => set_current({ id: edit.id, variant: v.id, view }, true));
		b.className = current?.id === edit.id && current?.variant === v.id && current?.view === view ? "on" : "";
		views.appendChild(b);
	};
	view_button("\u25B6 Game", "game", "Play what the game plays");
	view_button("\u25B6 Original", "original", "Play the unprocessed original");
	view_button("\u25B6 Recipe output", "render", "Play the recipe's output. It updates automatically after each edit");
	if (v.reference_master)
		view_button("\u25B6 Reference", "reference", "Play the reference master the game currently uses. The first recipe edit replaces it.");

	bar.appendChild(views);
	bar.insertAdjacentHTML("beforeend", `<span class="spacer"></span>`);

	// Fix the recording itself in an external editor; the recipe still applies to the edited recording
	const editor = state.editor;
	const open = button(`\u270E Edit in ${editor.name}`, "", () => post({ action: "open_editor", id: edit.id, variant: v.id }));
	open.disabled = !editor.available || !v.source;
	open.title = !editor.available ? editor.hint
		: !v.source ? "Import the original first."
		: `Open a copy of the unprocessed original in ${editor.name}. Use File > Export Audio over the same file to replace this variant's original; the status, note and recipe are kept.`;
	bar.appendChild(open);
	el.appendChild(bar);

	// A variant without an imported original cannot be prepared yet
	if (!v.source)
	{
		const p = document.createElement("p");
		p.className = "warn note";
		p.textContent = v.origin.startsWith("hand_made:") ? "Hand-made: import its file into the originals folder to edit a recipe." : "The original has not been imported yet. Accept the variant or use 'Import originals'.";
		el.appendChild(p);
	}

	// One numbered row per step, in processing order
	const steps = document.createElement("div");
	steps.className = "steps";
	edit_recipe.forEach((step, i) => steps.appendChild(render_step(step, i)));
	if (!edit_recipe.length)
		steps.insertAdjacentHTML("beforeend", `<div class="empty">No processing steps. The game plays the original as it is.</div>`);

	el.appendChild(steps);

	// Add a step at the end
	const add_row = document.createElement("div");
	add_row.className = "addstep";
	const add = document.createElement("select");
	add.innerHTML = "<option value=''>+ Add step...</option>" + Object.entries(STEPS).map(([k, s]) => `<option value="${k}">${s.label}</option>`).join("");
	add.onchange = () =>
	{
		if (!add.value)
			return;

		edit_recipe.push({ step: add.value, ...structuredClone(STEPS[add.value].init) });
		recipe_changed(true);
	};
	add_row.appendChild(add);
	el.appendChild(add_row);
	if (v.source)
		render_clips(el);

	update_recipe_state();
}

// Create several independent sounds from the original without changing the open variant.
function render_clips(parent)
{
	// Draft ranges survive recipe redraws and preview changes within the same variant.
	const el = document.createElement("details");
	el.id = "clips";
	el.open = clip_ranges.length !== 0;
	const heading = document.createElement("summary");
	heading.textContent = "Create clips from original";
	el.appendChild(heading);
	const help = document.createElement("p");
	help.textContent = "Times are seconds in the unprocessed original. Each range creates a separate candidate with its own Trim recipe. Ranges may overlap. Accept clips after listening to them; the original and this variant stay unchanged.";
	el.appendChild(help);
	el.appendChild(button("Play original", "Listen and seek in the original to find clip boundaries", () => set_current({ ...edit, view: "original" }, true)));

	// A destination is selected per range, including the current sound ID.
	clip_ranges.forEach((range, i) =>
	{
		const row = document.createElement("div");
		row.className = "range";
		const pick = id_select([], id => { range.id = id; });
		pick.value = range.id;
		pick.setAttribute("aria-label", `Clip ${i + 1} sound ID`);
		row.appendChild(pick);
		for (const name of ["start", "end"])
		{
			const label = document.createElement("label");
			label.textContent = `${name} `;
			const input = document.createElement("input");
			input.type = "number";
			input.min = "0";
			input.step = "0.001";
			input.value = range[name] ?? "";
			input.oninput = () => { range[name] = input.value === "" ? null : input.valueAsNumber; };
			label.appendChild(input);
			label.append(" s");
			row.appendChild(label);
			row.appendChild(button(`Set ${name}`, "Use the playhead position while the original is selected", () =>
			{
				// Processed playback has another timeline and must never supply original timestamps.
				if (current?.id !== edit.id || current?.variant !== edit.variant || current?.view !== "original")
				{
					show_message("Select Play original before setting a clip boundary from the playhead.", true);
					return;
				}
				const entry = buffers.get(url_of(current));
				range[name] = Number((entry ? wrap_time(entry, position()) : position()).toFixed(3));
				input.value = range[name];
			}));
		}
		row.appendChild(button("Remove", "Remove this unsubmitted range", () => { clip_ranges.splice(i, 1); render_recipe(); }));
		el.appendChild(row);
	});

	// Creation uses the existing state action and render jobs, and leaves errors beside the retained draft.
	el.appendChild(button("+ range", "Add another clip from this original", () =>
	{
		clip_ranges.push({ id: edit.id, start: 0, end: null });
		render_recipe();
	}));
	const create = button("Create clips", "Create candidates; no clip is accepted automatically", async () =>
	{
		create.disabled = true;
		try
		{
			const target = { ...edit };
			const ranges = structuredClone(clip_ranges);
			const { buf } = await buffer_for(url_of({ ...target, view: "original" }));
			if (ranges.some(r => !r.id || !Number.isFinite(r.start) || !Number.isFinite(r.end) || r.start < 0 || r.end <= r.start || r.end > buf.duration))
				throw new Error(`Choose a sound ID and 0 <= start < end <= ${buf.duration.toFixed(3)} seconds for every range.`);

			const result = await post({ action: "clips", ...target, ranges });
			if (!result.error && edit?.id === target.id && edit?.variant === target.variant && JSON.stringify(clip_ranges) === JSON.stringify(ranges))
			{
				clip_ranges = [];
				render_recipe();
			}
		}
		catch (error)
		{
			show_message(error.message, true);
		}
		finally
		{
			create.disabled = clip_ranges.length === 0;
		}
	});
	create.disabled = clip_ranges.length === 0;
	el.appendChild(create);
	parent.appendChild(el);
}

// Build the controls for one recipe step
function render_step(step, i)
{
	const row = document.createElement("div");
	row.className = "step" + (step.bypass ? " bypass" : "");
	row.insertAdjacentHTML("beforeend", `<span class="num">${i + 1}</span>`);
	const kind = document.createElement("span");
	kind.className = "kind";
	kind.textContent = STEPS[step.step]?.label ?? step.step;
	row.appendChild(kind);

	// Parameters, each changing the edited recipe directly
	const params = document.createElement("span");
	params.className = "params";
	row.appendChild(params);
	for (const [name, unit] of Object.entries(STEPS[step.step]?.params ?? {}))
	{
		const label = document.createElement("label");
		label.textContent = STEPS[step.step].names?.[name] ?? name;
		let input;
		if (unit === "curve" || unit === "slope")
		{
			input = document.createElement("select");
			const options = unit === "curve" ? ["linear", "sine"] : [12, 24, 36, 48];
			input.innerHTML = options.map(o => `<option${String(step[name]) === String(o) ? " selected" : ""}>${o}</option>`).join("");
			input.onchange = () => { step[name] = unit === "slope" ? Number(input.value) : input.value; recipe_changed(false); };
		}
		else
		{
			input = document.createElement("input");
			input.type = "number";
			input.step = unit === "Hz" ? "10" : unit === "s" ? "0.05" : "0.5";
			input.value = step[name] ?? "";
			input.placeholder = name === "end" ? "end" : "";
			input.oninput = () =>
			{
				// An empty optional field means 'not set', such as a trim to the end of the sound
				if (input.value === "")
					delete step[name];
				else if (Number.isFinite(input.valueAsNumber))
					step[name] = input.valueAsNumber;

				recipe_changed(false);
			};
		}
		label.appendChild(input);
		if (unit !== "curve" && unit !== "slope")
			label.append(unit);

		params.appendChild(label);
	}

	// Bypass, reorder and remove
	const tools = document.createElement("span");
	tools.className = "tools";
	row.appendChild(tools);
	const bypass = button("Bypass", "Skip this step without removing it", () => { if (step.bypass) delete step.bypass; else step.bypass = true; recipe_changed(true); });
	bypass.className = step.bypass ? "on" : "";
	tools.appendChild(bypass);
	const up = icon_button("\u25B2", "Earlier", () => { [edit_recipe[i - 1], edit_recipe[i]] = [edit_recipe[i], edit_recipe[i - 1]]; recipe_changed(true); }, true);
	up.disabled = i === 0;
	tools.appendChild(up);
	const down = icon_button("\u25BC", "Later", () => { [edit_recipe[i + 1], edit_recipe[i]] = [edit_recipe[i], edit_recipe[i + 1]]; recipe_changed(true); }, true);
	down.disabled = i === edit_recipe.length - 1;
	tools.appendChild(down);
	tools.appendChild(icon_button("\u2715", "Remove", () => { edit_recipe.splice(i, 1); recipe_changed(true); }, true));
	if (step.step !== "mix")
		return row;

	// A mix lists the recordings it adds below its own controls
	const group = document.createElement("div");
	group.appendChild(row);
	(step.inputs ??= []).forEach((input, j) => group.appendChild(render_mix_input(step, input, j)));
	const more = button("+ recording", "Add another recording to the mix", () => { step.inputs.push({ origin: "", start: 0, db: 0 }); recipe_changed(true); });
	more.className = "mixadd";
	group.appendChild(more);
	return group;
}

// Build the controls for recording 'j' of mix 'step': which recording, where it starts, its level and its credit
function render_mix_input(step, input, j)
{
	// Any known recording can be picked by typing part of its name; the edited sound's own candidates are listed first
	const row = document.createElement("div");
	row.className = "mixinput" + (step.bypass ? " bypass" : "");
	const pick = document.createElement("input");
	pick.type = "search";
	pick.placeholder = "type to find a recording...";
	pick.setAttribute("list", mix_origin_list().id);
	pick.value = input.origin;
	pick.size = 28;
	pick.onchange = () =>
	{
		// Only a known origin is taken; the server binds its original, importing it if needed
		if (!state.origins[pick.value])
			return;

		input.origin = pick.value;
		delete input.source;
		recipe_changed(true);
	};
	row.appendChild(pick);

	// Start point and level, changing the edited recipe directly
	for (const [name, unit, step_size] of [["start", "s", "0.05"], ["db", "dB", "0.5"]])
	{
		const label = document.createElement("label");
		label.textContent = name;
		const field = document.createElement("input");
		field.type = "number";
		field.step = step_size;
		field.value = input[name] ?? 0;
		field.oninput = () =>
		{
			if (Number.isFinite(field.valueAsNumber))
				input[name] = field.valueAsNumber;

			recipe_changed(false);
		};
		label.appendChild(field);
		label.append(unit);
		row.appendChild(label);
	}

	// Listen to the recording alone, or take it out of the mix
	const listen = icon_button("\u25B6", "Play this recording on its own", () => set_current({ origin: input.origin }, true));
	listen.disabled = !state.origins[input.origin];
	row.appendChild(listen);
	row.appendChild(icon_button("\u2715", "Remove this recording from the mix", () => { step.inputs.splice(j, 1); recipe_changed(true); }, true));

	// The credit the recording carries into the game, and whether its original is ready to mix
	const credit = document.createElement("span");
	credit.className = "credit";
	credit.innerHTML = state.origins[input.origin] ? name_html(input.origin) : `<span class="muted">pick a recording</span>`;
	row.appendChild(credit);
	return row;
}

// The shared list of every known recording for the mix pickers, with the edited sound's candidates first
function mix_origin_list()
{
	// One list serves every picker in the recipe editor, and is rebuilt with it
	let list = document.getElementById("mixorigins");
	if (!list)
	{
		list = document.createElement("datalist");
		list.id = "mixorigins";
		document.getElementById("recipe").appendChild(list);
		const own = [...new Set((state.preps[edit.id] ?? []).map(v => v.origin))];
		const rest = Object.keys(state.origins).filter(o => !own.includes(o));
		for (const origin of [...own, ...rest].filter(o => state.origins[o]))
		{
			const option = document.createElement("option");
			option.value = origin;
			option.label = origin_label(origin);
			list.appendChild(option);
		}
	}
	return list;
}

// Note an edit: redraw for structural changes, then send the recipe after a short pause so a burst of edits makes one render
function recipe_changed(structural)
{
	if (structural)
		render_recipe();

	clearTimeout(edit_timer);
	edit_timer = setTimeout(flush_recipe, EDIT_DELAY_MS);
	update_recipe_state();
}

// Send a waiting recipe edit now, resolving once the server has it
async function flush_recipe()
{
	if (edit_timer === null)
		return;

	clearTimeout(edit_timer);
	edit_timer = null;
	if (edit)
		await post({ action: "recipe", id: edit.id, variant: edit.variant, recipe: edit_recipe });
}

// Show whether the recipe output is current, rendering or failed
function update_recipe_state()
{
	const el = document.getElementById("recipestate");
	const v = edit && variant_of(edit.id, edit.variant);
	if (!el || !v)
		return;

	if (edit_timer !== null)
		el.innerHTML = ` <span class="muted">editing...</span>`;
	else if (v.render_pending)
		el.innerHTML = ` <span class="muted">rendering...</span>`;
	else if (v.render_error)
		el.innerHTML = ` <span class="error">Render failed, still playing the last working output: ${esc(v.render_error)}</span>`;
	else if (v.render_url)
		el.innerHTML = ` <span class="muted">up to date</span>`;
	else
		el.innerHTML = "";

	// The external editor's state: opening, the last imported edit, or why it failed
	const edit_el = document.getElementById("editstate");
	if (!edit_el)
		return;

	const e = v.edit;
	const how = `In ${state.editor.name}, use File > Export Audio over the same file (Ctrl+S saves a project instead)`;
	if (!e)
		edit_el.innerHTML = "";
	else if (e.pending)
		edit_el.innerHTML = ` <span class="muted">working...</span>`;
	else if (e.error)
		edit_el.innerHTML = ` <span class="error">${esc(e.error)}</span>`;
	else
		edit_el.innerHTML = ` <span class="muted" title="${esc(e.path ?? "")}">${esc(e.notice ?? "Open.")} ${esc(how)}.</span>`;
}

function render()
{
	render_ids();
	render_list();
	render_player();
	render_status();
	render_find();
	update_recipe_state();
}

// Offer an AI search for new candidates for the selected sound. It needs the assistant and Freesound credentials, and shows how to enable whichever is missing.
function render_find()
{
	const row = document.getElementById("findrow");
	const button = document.getElementById("find");
	const info = document.getElementById("findinfo");
	row.hidden = adding || !sel_id || sel_id === POOL;
	if (row.hidden)
		return;

	// The latest search result of this sound stays visible until the next search
	const find = state.finds[sel_id];
	const ai = state.assistant;
	button.disabled = !ai.available || !state.freesound.configured || !!find?.pending;
	button.title = `Ask an AI model (${ai.description}) to search Freesound and add up to 5 new CC0 or CC-BY recordings that suit ${sel_id} as unheard variants. Accepted and rejected variants and their notes guide the choice.`;
	if (!ai.available)
		info.innerHTML = `<span class="warn">${esc(ai.description)}</span>`;
	else if (!state.freesound.configured)
		info.innerHTML = `<span class="warn">Enter the Freesound API credentials first.</span>`;
	else if (find?.pending)
		info.innerHTML = `<span class="muted">Searching... this takes a minute or two.</span>`;
	else if (find?.error)
		info.innerHTML = `<span class="error">${esc(find.error)}</span>`;
	else
		info.innerHTML = find?.notice ? `<span class="muted">${esc(find.notice)}</span>` : "";
}

// Show the Freesound login state and the background work in progress
function render_status()
{
	const fs = state.freesound;
	const status = document.getElementById("fsstatus");
	document.getElementById("fssetup").hidden = fs.configured;
	if (!fs.configured)
		status.innerHTML = `<span class="dot no"></span><span class="warn">To download originals, create credentials at <a href="https://freesound.org/apiv2/apply/" target="_blank">freesound.org/apiv2/apply</a> with callback <code>${location.origin}/freesound/callback</code>.</span> `;
	else if (!fs.connected)
		status.innerHTML = `<span class="dot no"></span><a href="/freesound/connect">Connect to Freesound</a> <a href="#" id="fschange">(change credentials)</a> `;
	else
		status.innerHTML = `<span class="dot ok"></span>Freesound <a href="#" id="fschange">(change)</a> `;

	const change = document.getElementById("fschange");
	if (change)
		change.onclick = e => { e.preventDefault(); document.getElementById("fssetup").hidden = false; };

	document.getElementById("pending").textContent = state.pending.length ? `Working: ${state.pending.join(", ")}` : "";

	// Edits reach the game after a pause; the last result stays until the next publish
	const p = state.publish;
	const publish = document.getElementById("publish");
	publish.title = p.enabled ? `Edits are sent to running games, then cooked, after a short pause. Send: ${state.send ?? "none"}. Apply: ${state.apply ?? "none"}` : "";
	if (p.running.length)
		publish.innerHTML = `<span class="muted">Publishing ${esc(p.running.join(", "))}...</span>`;
	else if (p.waiting.length)
		publish.innerHTML = `<span class="muted">Will publish ${esc(p.waiting.join(", "))}</span>`;
	else if (p.error)
		publish.innerHTML = `<span class="error">${esc(p.error)}</span>`;
	else
		publish.innerHTML = p.notice ? `<span class="muted">${esc(p.notice)}</span>` : "";

	// The project may supply a command that makes it use the review results
	const apply = document.getElementById("apply");
	apply.hidden = !state.apply;
	apply.title = `Cook now, for changes made outside this tool. Runs: ${state.apply ?? ""}`;
}

// Run the project's apply command after the server has every edit; it can take a while, so the button stays disabled until it ends
document.getElementById("apply").onclick = async e =>
{
	const button = e.currentTarget;
	button.disabled = true;
	try
	{
		await flush_recipe();
		show_message("Applying...", false);
		const r = await fetch("/api/apply", { method: "POST" });
		const s = await r.json();
		adopt_state(s);
		show_message(s.error ?? s.notice ?? "", !!s.error);
	}
	catch (ex)
	{
		show_message(`Apply failed: ${ex.message}`, true);
	}
	finally
	{
		button.disabled = false;
	}
};

// Store the Freesound API credentials; connecting is a separate step through the Freesound login page
document.getElementById("fssave").onclick = async () =>
{
	const body = { client_id: document.getElementById("fsid").value, client_secret: document.getElementById("fssecret").value };
	const r = await fetch("/api/freesound", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
	if (!r.ok)
		show_message(await r.text(), true);

	await refresh();
};

// Keep the transport moving while playing, and sharp when the window resizes
setInterval(draw_transport, 50);
window.addEventListener("resize", draw_transport);

// Clicking or dragging on the waveform seeks the sound it shows
{
	// Seeking restarts playback at the new point, or moves the start point when stopped
	const wave = document.getElementById("wave");
	const seek = e =>
	{
		const url = source ? source_url : url_of(current);
		const entry = url && buffers.get(url);
		if (!entry)
			return;

		const rect = wave.getBoundingClientRect();
		const frac = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
		const at = entry.buf.duration * frac;
		if (source)
			start(at);
		else
			offset = at;

		draw_transport();
	};
	wave.addEventListener("pointerdown", e =>
	{
		wave.setPointerCapture(e.pointerId);
		seek(e);
	});
	wave.addEventListener("pointermove", e =>
	{
		if (wave.hasPointerCapture(e.pointerId))
