<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Audio authoring</title>
<style>
	body { margin: 0; font: 14px "Segoe UI", sans-serif; background: #1e1f22; color: #ddd; display: flex; height: 100vh; }
	#ids { width: 300px; overflow-y: auto; border-right: 1px solid #333; padding: 8px; box-sizing: border-box; }
	#ids h3 { font-size: 12px; color: #888; margin: 12px 0 4px; text-transform: uppercase; }
	#ids div.id { padding: 3px 6px; cursor: pointer; border-radius: 3px; display: flex; justify-content: space-between; }
	#ids div.id:hover { background: #2b2d31; }
	#ids div.id.sel { background: #3a4d6b; }
	#ids div.id.final { color: #4ae57a; }
	#ids span.count { color: #888; font-size: 12px; }
	#ids span.count.done { color: #6c6; }
	#main { flex: 1; overflow-y: auto; padding: 12px 16px; }
	#player { position: sticky; top: 0; z-index: 1; background: #26282c; padding: 10px; border-radius: 6px; margin-bottom: 12px; }
	#player .ab { display: flex; gap: 8px; margin-bottom: 8px; }
	#player .slot { flex: 1; padding: 6px 8px; border: 2px solid #444; border-radius: 4px; overflow: hidden; hidden; white-space: nowrap; text-overflow: ellipsis; }
	#player .slot.live { border-color: #5a9; background: #2e3b35; }
	#pos { width: 100%; }
	#recipe { background: #24262a; border: 1px solid #3a3d43; border-radius: 6px; padding: 8px 10px; margin-bottom: 12px; }
	#recipe h3 { margin: 0 0 6px; font-size: 15px; }
	#recipe .step { display: flex; align-items: center; gap: 6px; padding: 3px 0; border-bottom: 1px solid #333; }
	#recipe .step.bypass { opacity: 0.5; }
	#recipe .step .kind { width: 90px; font-weight: 600; }
	#recipe .step label { color: #aaa; font-size: 12px; }
	#recipe .mixinput { display: flex; align-items: center; gap: 6px; padding: 3px 0 3px 96px; border-bottom: 1px solid #333; }
	#recipe .mixinput.bypass { opacity: 0.5; }
	#recipe .mixinput label { color: #aaa; font-size: 12px; }
	#recipe .mixinput .credit { font-size: 12px; }
	#recipe .mixadd { margin: 3px 0 3px 96px; }
	#recipe input[type=number] { width: 72px; }
	#clips { margin-top: 10px; border-top: 1px solid #444; padding-top: 8px; }
	#clips .range { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 6px 0; }
	table { border-collapse: collapse; width: 100%; }
	td, th { padding: 4px 6px; border-bottom: 1px solid #333; text-align: left; vertical-align: middle; }
	tr.accepted td { background: #2e3b35; }
	tr.section th { padding-top: 14px; color: #9c9; font-size: 1.05em; }
	tr.rejected td { opacity: 0.45; }
	tr.current td { outline: 1px solid #59f; }
	tr.current td:first-child { box-shadow: inset 3px 0 #59f; }
	button { background: #3a3d43; color: #ddd; border: 1px solid #555; border-radius: 3px; padding: 2px 8px; cursor: pointer; }
	button:hover { background: #4a4e55; }
	button:disabled { opacity: 0.4; cursor: default; }
	button.on { background: #3a4d6b; border-color: #59f; }
	button.on.finalised { background: #2e6b3a; border-color: #4ae57a; }
	input[type=text], input[type=number], select { background: #2b2d31; color: #ddd; border: 1px solid #555; border-radius: 3px; padding: 2px 4px; }
	input.note { width: 100%; }
	a { color: #8ab4f8; }
	.muted { color: #888; }
	.warn { color: #e5b04a; }
	.error { color: #f28b82; }
	kbd { background: #333; border: 1px solid #555; border-radius: 3px; padding: 0 4px; font-size: 12px; }
	#status { margin-top: 6px; font-size: 13px; }
	#soundform { background: #24262a; border: 1px solid #3a3d43; border-radius: 6px; padding: 6px 10px; margin-bottom: 12px; }
	#soundform .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 3px 0; }
	#soundform label { color: #aaa; font-size: 13px; }
	#soundform label.wide { flex: 1; display: flex; gap: 6px; align-items: center; }
	#soundform input[type=number] { width: 64px; }
	#ids button.addsound { width: 100%; margin-bottom: 6px; }
	#importform { background: #24262a; border: 1px solid #3a3d43; border-radius: 6px; padding: 6px 10px; margin-top: 6px; }
	#importform .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 3px 0; }
	#importform label { color: #aaa; font-size: 13px; }
	#importform label.wide { flex: 1; display: flex; gap: 6px; align-items: center; }
	#main.dropping { outline: 2px dashed #59f; outline-offset: -4px; }
</style>
</head>
<body>
<div id="ids"></div>
<div id="main">
	<div id="player">
		<div class="ab">
			<div class="slot live" id="current" title="The current sound. Its recipe is shown below.">(pick a sound)</div>
		</div>
		<div>
			<button id="play" title="Play or stop the current sound">Play <kbd>Space</kbd></button>
			<button id="seam" title="Play the last 3 s running into the first 3 s, to hear the loop join">Loop seam</button>
			<label title="Scales playback only, so different recordings can be compared at similar levels. Prepared files are not changed. Turn off to hear the actual prepared gain.">
				<input type="checkbox" id="match"> Match loudness (playback only)</label>
			<label title="Repeat playback here. Starts as the selected sound's 'Loops in game' setting.">
				<input type="checkbox" id="loopplay" checked> Loop playback</label>
			<button id="apply" hidden>Apply</button>
			<span class="muted" id="time"></span>
		</div>
		<input type="range" id="pos" min="0" max="1000" value="0">
		<div id="status">
			<span id="fsstatus"></span>
			<span id="fssetup" hidden>
				Freesound API <input type="text" id="fsid" placeholder="client id" size="14"> <input type="text" id="fssecret" placeholder="client secret" size="24">
				<button id="fssave">Save</button>
			</span>
			<span class="muted" id="pending"></span>
			<span id="publish"></span>
			<span id="message"></span>
		</div>
	</div>
	<div id="recipe" hidden></div>
	<h2 id="title">Pick a sound ID</h2>
	<div id="soundform" hidden title="The sound's entry in the project's catalog. Saved changes reach the game after a short pause.">
		<div class="row">
			<label title="Lower-case dotted name, e.g. 'shore.lapping'. Renaming also renames the sound's preparation file and reference masters, but game code that names the ID must be changed by hand.">ID <input type="text" id="sf_id" size="28"></label>
			<label title="Pick a section or type a new name; a new section is added at the end of the catalog">Section <input type="text" id="sf_section" list="sf_sections" size="16"></label>
			<label title="The mix group whose volume controls this sound">Group <input type="text" id="sf_group" list="sf_groups" size="14"></label>
			<label title="Linear gain applied in the game">Gain <input type="number" id="sf_gain" min="0" step="0.01"></label>
		</div>
		<div class="row">
			<label title="A bed surrounds the listener. A positioned sound comes from a point in the world, so it must be mono and needs a range.">Placement <select id="sf_placement"><option value="bed">bed (surrounds)</option><option value="positioned">positioned (from a point)</option></select></label>
			<label>Channels <select id="sf_channels"><option value="mono">mono</option><option value="stereo">stereo</option></select></label>
			<label title="Distance in metres at which a positioned sound becomes silent">Range (m) <input type="number" id="sf_range" min="0" step="0.5"></label>
			<label title="Whether the game repeats the sound"><input type="checkbox" id="sf_loop"> Loops</label>
			<label title="Memory keeps the whole sound uncompressed in memory, which suits short sounds that play often. Stream decodes compressed (Ogg) audio as it plays, which suits anything long.">Load <select id="sf_load"><option value="memory">memory (short sounds)</option><option value="stream">stream (long sounds)</option></select></label>
			<label title="Optional expected length range in seconds; leave both blank for none">Length (s) <input type="number" id="sf_len_min" min="0" step="0.1"> to <input type="number" id="sf_len_max" min="0" step="0.1"></label>
		</div>
		<div class="row"><label class="wide">Description <input type="text" id="sf_desc" class="note"></label></div>
		<div class="row">
			<button id="sf_save">Save</button>
			<button id="sf_cancel" hidden>Cancel</button>
			<button id="sf_delete" title="Remove the sound from the catalog and delete its preparation file and reference masters">Delete sound</button>
			<span class="muted" id="sf_active"></span>
		</div>
	</div>
	<datalist id="sf_sections"></datalist>
	<datalist id="sf_groups"></datalist>
	<table id="list"></table>
	<p>
		Add a Freesound sound <span id="addto"></span>: <input type="text" id="addnum" placeholder="number or page address" size="28">
		<button id="add">Add</button>
	</p>
	<div id="importrow">
		Add a file from disk <span id="importto"></span>: <button id="importpick" title="Choose an audio file, or drop one anywhere on this page">Choose file...</button>
		<span class="muted">or drop one on this page</span>
		<input type="file" id="importfile" accept=".wav,.mp3,.flac,.ogg,.opus" hidden>
		<div id="importform" hidden>
			<div class="row"><span id="im_file"></span></div>
			<div class="row">
				<label class="wide">Title <input type="text" id="im_title" class="note"></label>
				<label class="wide">Author <input type="text" id="im_author" class="note"></label>
			</div>
			<div class="row">
				<label class="wide">Licence <input type="text" id="im_licence" class="note" placeholder="e.g. CC0, CC-BY 4.0"></label>
				<label class="wide">URL <input type="text" id="im_url" class="note" placeholder="optional"></label>
			</div>
			<div class="row">
				<button id="im_add" title="Copy the file into the originals folder, which is kept with the project. Rejecting it later removes the copy again.">Add</button>
				<button id="im_cancel">Cancel</button>
			</div>
		</div>
	</div>
	<p id="findrow" hidden>
		<button id="find">Find more candidates</button>
		<span id="findinfo"></span>
	</p>
</div>
<script>
"use strict";

// Review state from the server and the selected sound ID
let state = null;
let sel_id = null;

// The current sound. A slot names what to play rather than a file, so it follows new renders: { origin } for an unassigned recording, or
// { id, variant, view } where 'view' is 'game' (what the game plays), 'render' (the recipe's output), 'reference' (the reference master) or 'original'.
let current = null;

// The variant of the current sound, whose recipe is open, and the recipe being edited. Edits are sent after a short pause.
let edit = null;
let edit_recipe = null;
let edit_timer = null;
const EDIT_DELAY_MS = 600;

// Unsubmitted original-time ranges belong to the variant whose recipe is open.
let clip_ranges = [];

// Audio graph: one source plays at a time through a gain that applies playback-only loudness matching
const ctx = new AudioContext();
const gain = ctx.createGain();
gain.connect(ctx.destination);
const buffers = new Map();
let source = null;
let source_url = null;
let waiting = false;
let started_at = 0;
let offset = 0;
let seam_timer = null;
let poll_timer = null;
let state_json = null;
let render_deferred = false;

// The sound form adds a new sound when 'adding' is true, otherwise it edits the selected sound. It is filled only when the selection or mode changes,
// because the state is redrawn while polling and must not overwrite unsaved typing.
let adding = false;

// The pseudo ID that selects the pool of unassigned recordings
const POOL = "(unassigned)";

// Recipe step kinds, their parameters and the values a new step starts with
const STEPS = {
	trim: { label: "Trim", params: { start: "s", end: "s" }, init: { start: 0 } },
	cut: { label: "Cut", params: { start: "s", end: "s" }, init: { start: 0, end: 1 } },
	fade_in: { label: "Fade in", params: { duration: "s", curve: "curve" }, init: { duration: 0.5, curve: "sine" } },
	fade_out: { label: "Fade out", params: { duration: "s", curve: "curve" }, init: { duration: 0.5, curve: "sine" } },
	gain: { label: "Gain", params: { db: "dB" }, init: { db: 0 } },
	loudness: { label: "Loudness", params: { lufs: "LUFS" }, init: { lufs: -23 } },
	high_pass: { label: "High-pass", params: { frequency: "Hz", slope: "slope" }, init: { frequency: 80, slope: 12 } },
	low_pass: { label: "Low-pass", params: { frequency: "Hz", slope: "slope" }, init: { frequency: 12000, slope: 12 } },
	eq: { label: "EQ", params: { frequency: "Hz", db: "dB", q: "Q" }, init: { frequency: 1000, db: 0, q: 1 } },
	denoise: { label: "Denoise", params: { start: "s", end: "s", db: "dB" }, init: { start: 0, end: 0.5, db: 12 } },
	loop: { label: "Loop", params: { duration: "s" }, init: { duration: 3 } },
	mix: { label: "Mix", params: { db: "dB" }, init: { db: 0, inputs: [] } },
};

// Apply a new state from the server, then poll while background work or publishing is pending, or while an external editor may export an edit.
// A polled state redraws only when it changed, and waits while a dropdown has focus, because a redraw replaces the dropdown and closes its open list.
function adopt_state(s, polled = false)
{
	// Redraw now, or leave it for the focusout handler below
	const json = JSON.stringify(s);
	const changed = json !== state_json;
	state = s;
	state_json = json;
	if (!polled)
		render();
	else if (changed && document.activeElement?.tagName === "SELECT")
		render_deferred = true;
	else if (changed)
		render();

	follow_live_url();
	clearTimeout(poll_timer);
	if (state.pending.length || state.publish.waiting.length || state.publish.running.length)
		poll_timer = setTimeout(() => refresh(true), 500);
	else if (Object.values(state.preps).flat().some(v => v.edit))
		poll_timer = setTimeout(() => refresh(true), 1000);
}

// Apply a redraw that a polled state deferred while a dropdown was open
document.addEventListener("focusout", e =>
{
	// Redraw after the focus change completes, so the redraw doesn't fight the element taking focus
	if (!render_deferred || e.target.tagName !== "SELECT")
		return;

	render_deferred = false;
	setTimeout(render);
});

// Fetch the current state. 'polled' marks a background poll rather than a fetch after a user action.
async function refresh(polled = false)
{
	const r = await fetch("/api/state");
	adopt_state(await r.json(), polled);
}

// Send one action to the server; the reply carries the new state and a notice or error, and is returned so callers can follow up on success
async function post(body)
{
	const r = await fetch("/api/state", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
	const s = await r.json();
	adopt_state(s);
	show_message(s.error ?? s.notice ?? "", !!s.error);
	return s;
}

function show_message(text, is_error)
{
	const el = document.getElementById("message");
	el.textContent = text;
	el.className = is_error ? "error" : "muted";
}

// The variants of a sound ID, in saved order
function variants_of(id)
{
	return state.preps[id] ?? [];
}

function variant_of(id, variant_id)
{
	return variants_of(id).find(v => v.id === variant_id) ?? null;
}

// The address a slot plays now, or null
function url_of(slot)
{
	if (!slot)
		return null;

	if (slot.origin)
		return state.origins[slot.origin]?.play ?? null;

	const v = variant_of(slot.id, slot.variant);
	if (!v)
		return null;

	// The game plays the reference master or else the recipe's render. Only a variant that is not imported yet falls back to its preview.
	const original = state.origins[v.origin]?.play ?? null;
	switch (slot.view)
	{
		case "game": return v.reference_url ?? v.render_url ?? (v.source ? null : original);
		case "render": return v.render_url;
		case "reference": return v.reference_url;
		case "original": return original;
		default: throw new Error("Unknown view " + slot.view);
	}
}

// Decode a file once and remember its RMS level for playback-only loudness matching
async function buffer_for(url)
{
	if (buffers.has(url))
		return buffers.get(url);

	const data = await (await fetch(url)).arrayBuffer();
	const buf = await ctx.decodeAudioData(data);
	let sum = 0, n = 0;
	for (let c = 0; c != buf.numberOfChannels; ++c)
	{
		const d = buf.getChannelData(c);
		for (let i = 0; i < d.length; i += 4) { sum += d[i] * d[i]; ++n; }
	}
	const entry = { buf, rms: Math.sqrt(sum / Math.max(n, 1)) || 1e-6 };
	buffers.set(url, entry);
	return entry;
}

function position()
{
	return source ? offset + (ctx.currentTime - started_at) : offset;
}

function stop()
{
	clearTimeout(seam_timer);
	waiting = false;
	if (source)
	{
		offset = position();
		source.onended = null;
		source.stop();
		source = null;
	}
	document.getElementById("play").textContent = "Play";
}

// Start the current sound at the shared position. Playback repeats when 'Loop playback' is on or 'force_loop' is set; otherwise it stops at the end.
// A sound whose audio is still rendering waits, and starts when the render arrives.
async function start(at, force_loop)
{
	stop();
	const url = url_of(current);
	waiting = !url && is_rendering(current);
	if (!url)
	{
		document.getElementById("play").textContent = waiting ? "Stop" : "Play";
		render_player();
		return;
	}

	const { buf, rms } = await buffer_for(url);
	await ctx.resume();
	stop();
	gain.gain.value = document.getElementById("match").checked ? Math.min(0.1 / rms, 8) : 1;
	source = ctx.createBufferSource();
	source.buffer = buf;
	source.loop = !!force_loop || document.getElementById("loopplay").checked;
	source.onended = () =>
	{
		// Playback reached the end without looping, so return to the start ready to play again
		source = null;
		offset = 0;
		document.getElementById("play").textContent = "Play";
		render_player();
	};
	source.connect(gain);
	source_url = url;
	offset = (at ?? offset) % buf.duration;
	started_at = ctx.currentTime;
	source.start(0, offset);
	document.getElementById("play").textContent = "Stop";
	render_player();
}

// When a new render replaces what is playing, or arrives for a sound waiting to play, switch to it at the same position, so recipe edits are heard straight away
function follow_live_url()
{
	if ((source || waiting) && url_of(current) !== source_url)
		start(position());
}

// Play the end of the current sound running into its start to hear the loop join
async function seam()
{
	const url = url_of(current);
	if (!url)
		return;

	const { buf } = await buffer_for(url);
	await start(Math.max(buf.duration - 3, 0), true);
	seam_timer = setTimeout(stop, 6000);
}

// Make 'slot' the current sound, and play it from the shared position when 'play' is set. The recipe editor follows the current sound's variant.
function set_current(slot, play)
{
	// A different variant opens its own recipe, after sending any waiting edit of the previous one
	const variant = slot && !slot.origin ? { id: slot.id, variant: slot.variant } : null;
	if (variant?.id !== edit?.id || variant?.variant !== edit?.variant)
	{
		flush_recipe();
		edit = variant;
		edit_recipe = structuredClone((edit && variant_of(edit.id, edit.variant)?.recipe) ?? []);
		clip_ranges = [];
	}
	current = slot;

	// Switching keeps the playback position, so views of one variant can be compared at the same point
	if (play)
		start(position());
	else
		stop();

	render_recipe();
	render();
}

function origin_label(origin)
{
	const o = state.origins[origin];
	return o ? `${o.title ?? origin} (${o.user ?? "?"}, ${o.licence ?? "?"})` : origin;
}

const VIEW_NAMES = { game: "", render: " [recipe]", reference: " [reference master]", original: " [original]" };
function slot_label(slot)
{
	if (!slot)
		return null;

	if (slot.origin)
		return origin_label(slot.origin);

	const v = variant_of(slot.id, slot.variant);
	return v ? `${slot.id} ${v.id}: ${origin_label(v.origin)}${VIEW_NAMES[slot.view]}` : `${slot.id} ${slot.variant}`;
}

// The name cell of an origin: Freesound recordings link to their page. An edit is named like the recording it was made from.
function name_html(origin)
{
	const o = state.origins[origin] ?? {};
	const credit = `<span class="muted">${esc(o.user ?? "")} &middot; ${esc(o.licence ?? "")}</span>`;
	const title = esc(o.title ?? origin) + (o.edit_of ? ` <span class="muted">(edited)</span>` : "");
	const link = o.url ? `<a href="${esc(o.url)}" target="_blank">${esc((o.edit_of ?? origin).split(":")[1])}</a> ` : "";
	const import_state = o.import_pending ? ` <span class="muted">importing...</span>` : o.import_error ? ` <span class="error" title="${esc(o.import_error)}">import failed</span>` : "";
	return `${link}${title} ${credit}${import_state}`;
}

function esc(text)
{
	return String(text).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

function render_player()
{
	const el = document.getElementById("current");
	el.textContent = (slot_label(current) ?? "pick a sound") + availability(current);
}

// True when the slot's audio is a render still in progress
function is_rendering(slot)
{
	// Only recipe output renders; reference masters and originals are files already
	const v = slot && !slot.origin ? variant_of(slot.id, slot.variant) : null;
	return !!v && (slot.view === "game" || slot.view === "render") && v.render_pending && !url_of(slot);
}

// A note for a slot that cannot play now
function availability(slot)
{
	if (!slot || url_of(slot))
		return "";

	return is_rendering(slot) ? " (rendering...)" : " (not available)";
}

// The origins with no live variant anywhere, split by whether they are marked not useful. A recording that a live edit was made from counts as used.
function pool_origins()
{
	const live = Object.values(state.preps).flat().filter(v => v.status !== "rejected");
	const mixed = live.flatMap(v => (v.recipe ?? []).flatMap(s => s.inputs ?? [])).map(x => x.origin);
	const used = new Set([...live.map(v => v.origin), ...mixed, ...live.map(v => state.origins[v.origin]?.edit_of).filter(o => o)]);
	const origins = Object.keys(state.origins).filter(o => !used.has(o));
	return { open: origins.filter(o => !state.origins[o].not_useful), not_useful: origins.filter(o => state.origins[o].not_useful) };
}

// Draw the ID list with counts of accepted, unheard and live variants
function render_ids()
{
	const el = document.getElementById("ids");
	el.innerHTML = "";

	// New sounds start in the selected sound's section
	const add = button("+ Add sound", "Add a new sound ID to the project's catalog", () => start_add());
	add.className = "addsound";
	el.appendChild(add);

	// The unassigned pool comes first, as it is where new finds wait to be given a use
	const pool = pool_origins();
	const p = document.createElement("div");
	p.className = "id" + (sel_id === POOL ? " sel" : "");
	p.innerHTML = `<span><b>Unassigned</b></span><span class="count">${pool.open.length ? pool.open.length + " to sort / " : ""}${pool.open.length + pool.not_useful.length}</span>`;
	p.onclick = () => select_id(POOL);
	el.appendChild(p);

	// Sections keep their catalog order; the IDs within each section are alphabetical so a sound is easy to find
	const section_order = [...new Set(state.ids.map(x => x.section))];
	const ordered = [...state.ids].sort((a, b) => section_order.indexOf(a.section) - section_order.indexOf(b.section) || a.id.localeCompare(b.id));
	let section = null;
	for (const { id, section: sec } of ordered)
	{
		if (sec !== section)
		{
			section = sec;
			const h = document.createElement("h3");
			h.textContent = sec;
			el.appendChild(h);
		}
		const mine = variants_of(id).filter(v => v.status !== "rejected");
		const unheard = mine.filter(v => v.status === "unheard").length;
		const accepted = mine.filter(v => v.status === "accepted").length;

		// A sound is final when it has accepted variants, all of them finalised, and no candidates still to decide
		const final = mine.length !== 0 && mine.every(v => v.status === "accepted" && v.finalised);
		const d = document.createElement("div");
		d.className = "id" + (id === sel_id ? " sel" : "") + (final ? " final" : "");
		d.innerHTML = `<span>${esc(id)}</span><span class="count${accepted ? " done" : ""}">${accepted ? "&#10003;" + accepted + " " : ""}${unheard ? unheard + " new / " : ""}${mine.length}</span>`;
		d.onclick = () => select_id(id);
		el.appendChild(d);
	}
}

// Select an ID (or the unassigned pool) and clear the player and recipe editor
function select_id(id)
{
	flush_recipe();
	sel_id = id;
	current = null;
	edit = null;
	adding = false;
	stop();
	offset = 0;
	document.getElementById("loopplay").checked = state.ids.find(x => x.id === id)?.loop ?? true;
	render();
	render_recipe();
	fill_form(state.ids.find(x => x.id === id) ?? null);
}

// Open the form for a new sound, with defaults suited to a looping ambient bed in the selected sound's section
function start_add()
{
	const section = state.ids.find(x => x.id === sel_id)?.section ?? state.ids.at(-1)?.section ?? "";
	adding = true;
	fill_form({ id: "", section, placement: "bed", channels: "stereo", loop: true, load: "stream", group: "", gain: 1.0 });
	render_list();
	document.getElementById("sf_id").focus();
}

// Put a catalog entry into the sound form. The 'active' value has no editor, so it is kept from the entry and sent back unchanged.
let form_active = undefined;
let form_retrigger = undefined;
function fill_form(info)
{
	// Fields default to blank when there is no entry
	const f = id => document.getElementById(id);
	f("sf_id").value = info?.id ?? "";
	f("sf_section").value = info?.section ?? "";
	f("sf_group").value = info?.group ?? "";
	f("sf_gain").value = info?.gain ?? 1;
	f("sf_placement").value = info?.placement ?? "bed";
	f("sf_channels").value = info?.channels ?? "stereo";
	f("sf_range").value = info?.range_m ?? "";
	f("sf_loop").checked = !!info?.loop;
	f("sf_load").value = info?.load ?? "stream";
	f("sf_len_min").value = info?.length_s?.[0] ?? "";
	f("sf_len_max").value = info?.length_s?.[1] ?? "";
	f("sf_desc").value = info?.description ?? "";
	form_active = info?.active;
	form_retrigger = info?.retrigger;
	f("sf_active").textContent = [form_active ? `active: ${JSON.stringify(form_active)}` : "", form_retrigger ? `retrigger: ${JSON.stringify(form_retrigger)}` : ""].filter(x => x).join(" ");
	update_form();
}

// Keep the form consistent with the placement: a positioned sound is mono and has a range, while a bed has no range
function update_form()
{
	const positioned = document.getElementById("sf_placement").value === "positioned";
	const channels = document.getElementById("sf_channels");
	if (positioned)
		channels.value = "mono";

	channels.disabled = positioned;
	document.getElementById("sf_range").disabled = !positioned;
	document.getElementById("sf_save").textContent = adding ? "Add" : "Save";
	document.getElementById("sf_cancel").hidden = !adding;
	document.getElementById("sf_delete").hidden = adding;
}

// The catalog entry described by the form. Optional values are left out when blank, and the server checks the rest.
function form_sound()
{
	// Required values
	const f = id => document.getElementById(id);
	const positioned = f("sf_placement").value === "positioned";
	const sound = {
		id: f("sf_id").value.trim(),
		placement: f("sf_placement").value,
		loop: f("sf_loop").checked,
		channels: positioned ? "mono" : f("sf_channels").value,
		load: f("sf_load").value,
		group: f("sf_group").value.trim(),
		gain: Number(f("sf_gain").value),
	};

	// Optional values; a length with only one end given is taken as a fixed length
	const min = f("sf_len_min").value, max = f("sf_len_max").value;
	if (min !== "" || max !== "")
		sound.length_s = [Number(min !== "" ? min : max), Number(max !== "" ? max : min)];
	if (positioned)
		sound.range_m = Number(f("sf_range").value);
	if (form_active)
		sound.active = form_active;
	if (form_retrigger)
		sound.retrigger = form_retrigger;
	if (f("sf_desc").value.trim())
		sound.description = f("sf_desc").value.trim();

	return { section: f("sf_section").value.trim(), sound };
}

// Add or save the sound in the form, confirming a rename because game code that names the old ID will no longer find it
async function save_form()
{
	// A new sound is added; an existing one is replaced, possibly under a new ID
	const { section, sound } = form_sound();
	let s;
	if (adding)
	{
		s = await post({ action: "add_sound", section, sound });
	}
	else
	{
		if (sound.id !== sel_id && !confirm(`Rename '${sel_id}' to '${sound.id}'?\n\nIts preparation file and reference masters are renamed too. Game code that names '${sel_id}' must be changed by hand.`))
			return;

		s = await post({ action: "edit_sound", id: sel_id, section, sound });
	}

	// On success, show the saved sound so the form holds what the catalog now says
	if (!s.error)
		select_id(sound.id);
}

// Delete the selected sound after confirming what is lost
async function delete_form()
{
	// Version control is the only way back, so the confirmation lists everything removed
	const id = sel_id;
	if (!confirm(`Delete '${id}'?\n\nThis removes it from the catalog and deletes its preparation file and the reference masters that no other sound uses. Game code that names '${id}' will break.`))
		return;

	const s = await post({ action: "delete_sound", id });
	if (!s.error)
		select_id(null);
}

// Draw the unassigned pool: recordings to listen to and either assign to an ID or mark not useful
function render_pool(t)
{
	const pool = pool_origins();
	for (const [text, origins] of [[`To sort (${pool.open.length})`, pool.open], [`Not useful (${pool.not_useful.length})`, pool.not_useful]])
	{
		// Each part has its own heading so not-useful recordings can still be found and restored
		const h = document.createElement("tr");
		h.className = "section";
		h.innerHTML = `<th colspan="4">${text}</th>`;
		t.appendChild(h);
		const cols = document.createElement("tr");
		cols.innerHTML = "<th></th><th>Recording</th><th>Earlier decisions</th><th>Assign to</th>";
		t.appendChild(cols);
		for (const o of origins)
			t.appendChild(render_pool_row(o));
	}
}

// Build the row for one unassigned recording
function render_pool_row(origin)
{
	// Not-useful rows are dimmed; the current sound's row is marked
	const o = state.origins[origin];
	const tr = document.createElement("tr");
	tr.className = (o.not_useful ? "rejected" : "") + (current?.origin === origin ? " current" : "");

	// Play it, and toggle whether it is useful
	const td_play = document.createElement("td");
	td_play.appendChild(button("\u25B6", "Play", () => set_current({ origin }, true)));
	const nu = button("not useful", "Hide from the list of recordings to sort", () => post({ action: "useful", origin, useful: !!o.not_useful }));
	nu.className = o.not_useful ? "on" : "";
	td_play.appendChild(nu);
	tr.appendChild(td_play);

	const td_name = document.createElement("td");
	td_name.innerHTML = name_html(origin);
	tr.appendChild(td_name);

	// Earlier rejections, so the same use is not tried again
	const td_earlier = document.createElement("td");
	td_earlier.className = "muted";
	td_earlier.textContent = Object.entries(state.preps).flatMap(([id, vs]) => vs.filter(v => v.origin === origin).map(v => `rejected for ${id}${v.note ? " (" + v.note + ")" : ""}`)).join("; ");
	tr.appendChild(td_earlier);

	// Give the recording a possible use; it then leaves the pool
	const td_assign = document.createElement("td");
	td_assign.appendChild(id_select([], id => post({ action: "assign", id, origin })));
	tr.appendChild(td_assign);
	return tr;
}

// Draw the variants of the selected ID: accepted ones in runtime order, then the candidates in their saved order. Rejected variants are hidden;
// they remain as rejection history and appear under Unassigned when they have no other use.
function render_list()
{
	const t = document.getElementById("list");
	t.innerHTML = "";
	document.getElementById("title").textContent = adding ? "New sound" : sel_id === POOL ? "Unassigned recordings" : (sel_id ?? "Pick a sound ID");
	document.getElementById("addto").textContent = sel_id && sel_id !== POOL ? `to ${sel_id}` : "to the unassigned pool";
	document.getElementById("importto").textContent = sel_id && sel_id !== POOL ? `to ${sel_id}` : "to the unassigned pool";

	// The form shows while adding or when a sound is selected; its choice lists follow the catalog
	const sound = state.ids.find(x => x.id === sel_id);
	document.getElementById("soundform").hidden = !adding && !sound;
	document.getElementById("sf_sections").innerHTML = [...new Set(state.ids.map(x => x.section))].map(x => `<option value="${esc(x)}">`).join("");
	document.getElementById("sf_groups").innerHTML = [...new Set(state.ids.map(x => x.group))].sort().map(x => `<option value="${esc(x)}">`).join("");
	if (!sel_id || adding)
		return;

	if (sel_id === POOL)
	{
		render_pool(t);
		return;
	}

	const variants = variants_of(sel_id);
	const accepted = variants.filter(v => v.status === "accepted");
	const others = variants.filter(v => v.status !== "accepted" && v.status !== "rejected");
	add_section(t, `Accepted (${accepted.length}), in runtime order`);
	accepted.forEach((v, i) => t.appendChild(render_row(v, i, accepted.length)));
	add_section(t, `Candidates (${others.length})`, others.some(v => !v.source) ? button("Import originals", "Fetch the original recordings of the candidates, so their recipes can be edited", () => post({ action: "prepare", id: sel_id, import: true })) : null);
	others.forEach(v => t.appendChild(render_row(v, -1, 0)));
}

// Add a section heading and column headings to the list
function add_section(t, text, extra)
{
	const h = document.createElement("tr");
	h.className = "section";
	h.innerHTML = `<th colspan="5">${text} </th>`;
	if (extra)
		h.firstChild.appendChild(extra);

	t.appendChild(h);
	const cols = document.createElement("tr");
	cols.innerHTML = "<th></th><th>Recording</th><th>Status</th><th>Note</th><th>Also try for</th>";
	t.appendChild(cols);
}

function button(text, title, onclick)
{
	const b = document.createElement("button");
	b.textContent = text;
	b.title = title;
	b.onclick = onclick;
	return b;
}

// A sound ID picker that calls 'pick' with the chosen ID, leaving out 'exclude'
function id_select(exclude, pick)
{
	const sel = document.createElement("select");
	sel.innerHTML = "<option value=''>...</option>" + state.ids.map(x => x.id).filter(x => !exclude.includes(x)).sort().map(x => `<option>${esc(x)}</option>`).join("");
	sel.onchange = () => { if (sel.value) pick(sel.value); };
	return sel;
}

// Build the row for one variant. 'index' and 'count' place accepted variants in runtime order; candidates have index -1.
function render_row(v, index, count)
{
	// Rows are styled by status; the current sound's row is marked
	const tr = document.createElement("tr");
	const is_current = !!edit && edit.id === sel_id && edit.variant === v.id;
	tr.className = v.status + (is_current ? " current" : "");

	// Accepted variants move within the runtime order
	const td_play = document.createElement("td");
	if (v.status === "accepted")
	{
		for (const [text, delta] of [["\u25B2", -1], ["\u25BC", 1]])
		{
			const mv = button(text, delta < 0 ? "Earlier in runtime order" : "Later in runtime order", () => post({ action: "move", id: sel_id, variant: v.id, delta }));
			mv.disabled = delta < 0 ? index === 0 : index === count - 1;
			td_play.appendChild(mv);
		}
	}

	// Play what the game would play; listening to an unheard variant makes it a candidate
	td_play.appendChild(button("\u25B6", "Play what the game plays, and show its recipe", () =>
	{
		if (v.status === "unheard")
			post({ action: "status", id: sel_id, variant: v.id, status: "candidate" });

		set_current({ id: sel_id, variant: v.id, view: "game" }, true);
	}));

	// Show this variant's recipe without playing it
	const e = button("\u270E recipe", "Show how this variant is prepared, without playing it", () => { if (!is_current) set_current({ id: sel_id, variant: v.id, view: "game" }, false); });
	e.className = v.recipe?.length ? "on" : "";
	td_play.appendChild(e);
	tr.appendChild(td_play);

	// The recording, with the state of its preparation
	const td_name = document.createElement("td");
	const prep_state = v.render_pending ? ` <span class="muted">rendering...</span>` : v.render_error ? ` <span class="error" title="${esc(v.render_error)}">render failed</span>` : "";
	const reference = v.reference_master ? ` <span class="warn" title="The game plays ${esc(v.reference_master)} until the recipe is edited">reference master</span>` : "";
	td_name.innerHTML = `<span class="muted">${v.id}</span> ${name_html(v.origin)}${reference}${prep_state}`;
	tr.appendChild(td_name);

	// Status buttons; several variants can be accepted for one ID
	const td_status = document.createElement("td");
	for (const st of ["accepted", "candidate", "rejected"])
	{
		const b = button(st, "", () =>
		{
			// A rejected recording is no longer worth hearing, so stop it if it is the one playing
			if (st === "rejected" && current && !current.origin && current.id === sel_id && current.variant === v.id)
				stop();

			post({ action: "status", id: sel_id, variant: v.id, status: st });
		});
		b.className = v.status === st ? "on" : "";
		td_status.appendChild(b);
	}

	// Finalised is separate from status: it marks a variant that has been heard all the way through and needs no more work
	const fin = button("finalised", "Listened to all the way through, and happy with it", () => post({ action: "finalised", id: sel_id, variant: v.id, finalised: !v.finalised }));
	fin.className = v.finalised ? "on finalised" : "";
	td_status.appendChild(fin);
	tr.appendChild(td_status);

	const td_note = document.createElement("td");
	const note = document.createElement("input");
	note.type = "text";
	note.className = "note";
	note.value = v.note ?? "";
	note.onchange = () => post({ action: "note", id: sel_id, variant: v.id, note: note.value });
	td_note.appendChild(note);
	tr.appendChild(td_note);

	// Assign the same recording to another ID. IDs it is already live for are left out.
	const td_try = document.createElement("td");
	const taken = Object.entries(state.preps).filter(([, vs]) => vs.some(x => x.origin === v.origin && x.status !== "rejected")).map(([id]) => id);
	td_try.appendChild(id_select(taken, id => post({ action: "assign", id, origin: v.origin })));
	tr.appendChild(td_try);
	return tr;
}

// Draw the recipe editor. It is redrawn only for structural changes, so typing in a parameter keeps focus.
function render_recipe()
{
	const el = document.getElementById("recipe");
	const v = edit && variant_of(edit.id, edit.variant);
	el.hidden = !v;
	el.innerHTML = "";
	if (!v)
		return;

	// Heading, preparation state and the listening choices for this variant
	const h = document.createElement("h3");
	h.textContent = `Recipe: ${edit.id} ${v.id} - ${origin_label(v.origin)}`;
	el.appendChild(h);
	const bar = document.createElement("div");
	const view_button = (text, view, title) =>
	{
		// Each view of this variant plays in place of the current one; the view playing now is marked
		const b = button(text, title, () => set_current({ id: edit.id, variant: v.id, view }, true));
		b.className = current?.view === view ? "on" : "";
		return b;
	};
	bar.appendChild(view_button("Game \u25B6", "game", "Play what the game plays"));
	bar.appendChild(view_button("Original \u25B6", "original", "Play the unprocessed original"));
	bar.appendChild(view_button("Recipe \u25B6", "render", "Play the recipe's output. It updates automatically after each edit"));
	if (v.reference_master)
		bar.appendChild(view_button("Reference \u25B6", "reference", "Play the reference master the game currently uses. The first recipe edit replaces it."));

	// Fix the recording itself in an external editor; the recipe still applies to the edited recording
	const editor = state.editor;
	const open = button(`\u270E Edit in ${editor.name}`, "", () => post({ action: "open_editor", id: edit.id, variant: v.id }));
	open.disabled = !editor.available || !v.source;
	open.title = !editor.available ? editor.hint
		: !v.source ? "Import the original first."
		: `Open a copy of the unprocessed original in ${editor.name}. Use File > Export Audio over the same file to replace this variant's original; the status, note and recipe are kept.`;
	bar.appendChild(open);
	const edit_info = document.createElement("span");
	edit_info.id = "editstate";
	bar.appendChild(edit_info);

	const info = document.createElement("span");
	info.id = "recipestate";
	bar.appendChild(info);
	el.appendChild(bar);

	// A variant without an imported original cannot be prepared yet
	if (!v.source)
	{
		const p = document.createElement("p");
		p.className = "warn";
		p.textContent = v.origin.startsWith("hand_made:") ? "Hand-made: import its file into the originals folder to edit a recipe." : "The original has not been imported yet. Accept the variant or use 'Import originals'.";
		el.appendChild(p);
	}

	// One row per step, in processing order
	edit_recipe.forEach((step, i) => el.appendChild(render_step(step, i)));

	// Add a step at the end
	const add = document.createElement("select");
	add.innerHTML = "<option value=''>Add step...</option>" + Object.entries(STEPS).map(([k, s]) => `<option value="${k}">${s.label}</option>`).join("");
	add.onchange = () =>
	{
		if (!add.value)
			return;

		edit_recipe.push({ step: add.value, ...structuredClone(STEPS[add.value].init) });
		recipe_changed(true);
	};
	el.appendChild(add);
	if (v.source)
		render_clips(el);

	update_recipe_state();
}

// Create several independent sounds from the original without changing the open variant.
function render_clips(parent)
{
	// Draft ranges survive recipe redraws and preview changes within the same variant.
	const el = document.createElement("details");
	el.id = "clips";
	el.open = clip_ranges.length !== 0;
	const heading = document.createElement("summary");
	heading.textContent = "Create clips from original";
	el.appendChild(heading);
	const help = document.createElement("p");
	help.textContent = "Times are seconds in the unprocessed original. Each range creates a separate candidate with its own Trim recipe. Ranges may overlap. Accept clips after listening to them; the original and this variant stay unchanged.";
	el.appendChild(help);
	el.appendChild(button("Play original", "Listen and seek in the original to find clip boundaries", () => set_current({ ...edit, view: "original" }, true)));

	// A destination is selected per range, including the current sound ID.
	clip_ranges.forEach((range, i) =>
	{
		const row = document.createElement("div");
		row.className = "range";
		const pick = id_select([], id => { range.id = id; });
		pick.value = range.id;
		pick.setAttribute("aria-label", `Clip ${i + 1} sound ID`);
		row.appendChild(pick);
		for (const name of ["start", "end"])
		{
			const label = document.createElement("label");
			label.textContent = `${name} `;
			const input = document.createElement("input");
			input.type = "number";
			input.min = "0";
			input.step = "0.001";
			input.value = range[name] ?? "";
			input.oninput = () => { range[name] = input.value === "" ? null : input.valueAsNumber; };
			label.appendChild(input);
			label.append(" s");
			row.appendChild(label);
			row.appendChild(button(`Set ${name}`, "Use the playhead position while the original is selected", () =>
			{
				// Processed playback has another timeline and must never supply original timestamps.
				if (current?.id !== edit.id || current?.variant !== edit.variant || current?.view !== "original")
				{
					show_message("Select Play original before setting a clip boundary from the playhead.", true);
					return;
				}
				const buf = buffers.get(url_of(current))?.buf;
				range[name] = Number((buf ? position() % buf.duration : position()).toFixed(3));
				input.value = range[name];
			}));
		}
		row.appendChild(button("Remove", "Remove this unsubmitted range", () => { clip_ranges.splice(i, 1); render_recipe(); }));
		el.appendChild(row);
	});

	// Creation uses the existing state action and render jobs, and leaves errors beside the retained draft.
	el.appendChild(button("+ range", "Add another clip from this original", () =>
	{
		clip_ranges.push({ id: edit.id, start: 0, end: null });
		render_recipe();
	}));
	const create = button("Create clips", "Create candidates; no clip is accepted automatically", async () =>
	{
		create.disabled = true;
		try
		{
			const target = { ...edit };
			const ranges = structuredClone(clip_ranges);
			const { buf } = await buffer_for(url_of({ ...target, view: "original" }));
			if (ranges.some(r => !r.id || !Number.isFinite(r.start) || !Number.isFinite(r.end) || r.start < 0 || r.end <= r.start || r.end > buf.duration))
				throw new Error(`Choose a sound ID and 0 <= start < end <= ${buf.duration.toFixed(3)} seconds for every range.`);

			const result = await post({ action: "clips", ...target, ranges });
			if (!result.error && edit?.id === target.id && edit?.variant === target.variant && JSON.stringify(clip_ranges) === JSON.stringify(ranges))
			{
				clip_ranges = [];
				render_recipe();
			}
		}
		catch (error)
		{
			show_message(error.message, true);
		}
		finally
		{
			create.disabled = clip_ranges.length === 0;
		}
	});
	create.disabled = clip_ranges.length === 0;
	el.appendChild(create);
	parent.appendChild(el);
}

// Build the controls for one recipe step
function render_step(step, i)
{
	const row = document.createElement("div");
	row.className = "step" + (step.bypass ? " bypass" : "");
	const kind = document.createElement("span");
	kind.className = "kind";
	kind.textContent = STEPS[step.step]?.label ?? step.step;
	row.appendChild(kind);

	// Parameters, each changing the edited recipe directly
	for (const [name, unit] of Object.entries(STEPS[step.step]?.params ?? {}))
	{
		const label = document.createElement("label");
		label.textContent = ` ${name} `;
		let input;
		if (unit === "curve" || unit === "slope")
		{
			input = document.createElement("select");
			const options = unit === "curve" ? ["linear", "sine"] : [12, 24, 36, 48];
			input.innerHTML = options.map(o => `<option${String(step[name]) === String(o) ? " selected" : ""}>${o}</option>`).join("");
			input.onchange = () => { step[name] = unit === "slope" ? Number(input.value) : input.value; recipe_changed(false); };
		}
		else
		{
			input = document.createElement("input");
			input.type = "number";
			input.step = unit === "Hz" ? "10" : unit === "s" ? "0.05" : "0.5";
			input.value = step[name] ?? "";
			input.placeholder = name === "end" ? "end" : "";
			input.oninput = () =>
			{
				// An empty optional field means 'not set', such as a trim to the end of the sound
				if (input.value === "")
					delete step[name];
				else if (Number.isFinite(input.valueAsNumber))
					step[name] = input.valueAsNumber;

				recipe_changed(false);
			};
		}
		label.appendChild(input);
		label.append(unit === "curve" || unit === "slope" ? "" : ` ${unit}`);
		row.appendChild(label);
	}

	// Bypass, reorder and remove
	const spacer = document.createElement("span");
	spacer.style.flex = "1";
	row.appendChild(spacer);
	const bypass = button("bypass", "Skip this step without removing it", () => { if (step.bypass) delete step.bypass; else step.bypass = true; recipe_changed(true); });
	bypass.className = step.bypass ? "on" : "";
	row.appendChild(bypass);
	const up = button("\u25B2", "Earlier", () => { [edit_recipe[i - 1], edit_recipe[i]] = [edit_recipe[i], edit_recipe[i - 1]]; recipe_changed(true); });
	up.disabled = i === 0;
	row.appendChild(up);
	const down = button("\u25BC", "Later", () => { [edit_recipe[i + 1], edit_recipe[i]] = [edit_recipe[i], edit_recipe[i + 1]]; recipe_changed(true); });
	down.disabled = i === edit_recipe.length - 1;
	row.appendChild(down);
	row.appendChild(button("\u2715", "Remove", () => { edit_recipe.splice(i, 1); recipe_changed(true); }));
	if (step.step !== "mix")
		return row;

	// A mix lists the recordings it adds below its own controls
	const group = document.createElement("div");
	group.appendChild(row);
	(step.inputs ??= []).forEach((input, j) => group.appendChild(render_mix_input(step, input, j)));
	const more = button("+ recording", "Add another recording to the mix", () => { step.inputs.push({ origin: "", start: 0, db: 0 }); recipe_changed(true); });
	more.className = "mixadd";
	group.appendChild(more);
	return group;
}

// Build the controls for recording 'j' of mix 'step': which recording, where it starts, its level and its credit
function render_mix_input(step, input, j)
{
	// Any known recording can be picked by typing part of its name; the edited sound's own candidates are listed first
	const row = document.createElement("div");
	row.className = "mixinput" + (step.bypass ? " bypass" : "");
	const pick = document.createElement("input");
	pick.type = "search";
	pick.placeholder = "type to find a recording...";
	pick.setAttribute("list", mix_origin_list().id);
	pick.value = input.origin;
	pick.size = 28;
	pick.onchange = () =>
	{
		// Only a known origin is taken; the server binds its original, importing it if needed
		if (!state.origins[pick.value])
			return;

		input.origin = pick.value;
		delete input.source;
		recipe_changed(true);
	};
	row.appendChild(pick);

	// Start point and level, changing the edited recipe directly
	for (const [name, unit, step_size] of [["start", "s", "0.05"], ["db", "dB", "0.5"]])
	{
		const label = document.createElement("label");
		label.textContent = ` ${name} `;
		const field = document.createElement("input");
		field.type = "number";
		field.step = step_size;
		field.value = input[name] ?? 0;
		field.oninput = () =>
		{
			if (Number.isFinite(field.valueAsNumber))
				input[name] = field.valueAsNumber;

			recipe_changed(false);
		};
		label.appendChild(field);
		label.append(` ${unit}`);
		row.appendChild(label);
	}

	// Listen to the recording alone, or take it out of the mix
	const listen = button("\u25B6", "Play this recording on its own", () => set_current({ origin: input.origin }, true));
	listen.disabled = !state.origins[input.origin];
	row.appendChild(listen);
	row.appendChild(button("\u2715", "Remove this recording from the mix", () => { step.inputs.splice(j, 1); recipe_changed(true); }));

	// The credit the recording carries into the game, and whether its original is ready to mix
	const credit = document.createElement("span");
	credit.className = "credit";
	credit.innerHTML = state.origins[input.origin] ? name_html(input.origin) : `<span class="muted">pick a recording</span>`;
	row.appendChild(credit);
	return row;
}

// The shared list of every known recording for the mix pickers, with the edited sound's candidates first
function mix_origin_list()
{
	// One list serves every picker in the recipe editor, and is rebuilt with it
	let list = document.getElementById("mixorigins");
	if (!list)
	{
		list = document.createElement("datalist");
		list.id = "mixorigins";
		document.getElementById("recipe").appendChild(list);
		const own = [...new Set((state.preps[edit.id] ?? []).map(v => v.origin))];
		const rest = Object.keys(state.origins).filter(o => !own.includes(o));
		for (const origin of [...own, ...rest].filter(o => state.origins[o]))
		{
			const option = document.createElement("option");
			option.value = origin;
			option.label = origin_label(origin);
			list.appendChild(option);
		}
	}
	return list;
}

// Note an edit: redraw for structural changes, then send the recipe after a short pause so a burst of edits makes one render
function recipe_changed(structural)
{
	if (structural)
		render_recipe();

	clearTimeout(edit_timer);
	edit_timer = setTimeout(flush_recipe, EDIT_DELAY_MS);
	update_recipe_state();
}

// Send a waiting recipe edit now, resolving once the server has it
async function flush_recipe()
{
	if (edit_timer === null)
		return;

	clearTimeout(edit_timer);
	edit_timer = null;
	if (edit)
		await post({ action: "recipe", id: edit.id, variant: edit.variant, recipe: edit_recipe });
}

// Show whether the recipe output is current, rendering or failed
function update_recipe_state()
{
	const el = document.getElementById("recipestate");
	const v = edit && variant_of(edit.id, edit.variant);
	if (!el || !v)
		return;

	if (edit_timer !== null)
		el.innerHTML = ` <span class="muted">editing...</span>`;
	else if (v.render_pending)
		el.innerHTML = ` <span class="muted">rendering...</span>`;
	else if (v.render_error)
		el.innerHTML = ` <span class="error">Render failed, still playing the last working output: ${esc(v.render_error)}</span>`;
	else if (v.render_url)
		el.innerHTML = ` <span class="muted">up to date</span>`;
	else
		el.innerHTML = "";

	// The external editor's state: opening, the last imported edit, or why it failed
	const edit_el = document.getElementById("editstate");
	if (!edit_el)
		return;

	const e = v.edit;
	const how = `In ${state.editor.name}, use File > Export Audio over the same file (Ctrl+S saves a project instead)`;
	if (!e)
		edit_el.innerHTML = "";
	else if (e.pending)
		edit_el.innerHTML = ` <span class="muted">working...</span>`;
	else if (e.error)
		edit_el.innerHTML = ` <span class="error">${esc(e.error)}</span>`;
	else
		edit_el.innerHTML = ` <span class="muted" title="${esc(e.path ?? "")}">${esc(e.notice ?? "Open.")} ${esc(how)}.</span>`;
}

function render()
{
	render_ids();
	render_list();
	render_player();
	render_status();
	render_find();
	update_recipe_state();
}

// Offer an AI search for new candidates for the selected sound. It needs the assistant and Freesound credentials, and shows how to enable whichever is missing.
function render_find()
{
	const row = document.getElementById("findrow");
	const button = document.getElementById("find");
	const info = document.getElementById("findinfo");
	row.hidden = adding || !sel_id || sel_id === POOL;
	if (row.hidden)
		return;

	// The latest search result of this sound stays visible until the next search
	const find = state.finds[sel_id];
	const ai = state.assistant;
	button.disabled = !ai.available || !state.freesound.configured || !!find?.pending;
	button.title = `Ask an AI model (${ai.description}) to search Freesound and add up to 5 new CC0 or CC-BY recordings that suit ${sel_id} as unheard variants. Accepted and rejected variants and their notes guide the choice.`;
	if (!ai.available)
		info.innerHTML = `<span class="warn">${esc(ai.description)}</span>`;
	else if (!state.freesound.configured)
		info.innerHTML = `<span class="warn">Enter the Freesound API credentials first.</span>`;
	else if (find?.pending)
		info.innerHTML = `<span class="muted">Searching... this takes a minute or two.</span>`;
	else if (find?.error)
		info.innerHTML = `<span class="error">${esc(find.error)}</span>`;
	else
		info.innerHTML = find?.notice ? `<span class="muted">${esc(find.notice)}</span>` : "";
}

// Show the Freesound login state and the background work in progress
function render_status()
{
	const fs = state.freesound;
	const status = document.getElementById("fsstatus");
	document.getElementById("fssetup").hidden = fs.configured;
	if (!fs.configured)
		status.innerHTML = `<span class="warn">To download originals, create credentials at <a href="https://freesound.org/apiv2/apply/" target="_blank">freesound.org/apiv2/apply</a> with callback <code>${location.origin}/freesound/callback</code>.</span> `;
	else if (!fs.connected)
		status.innerHTML = `<a href="/freesound/connect">Connect to Freesound</a> <a href="#" id="fschange">(change credentials)</a> `;
	else
		status.innerHTML = `Freesound connected <a href="#" id="fschange">(change)</a> `;

	const change = document.getElementById("fschange");
	if (change)
		change.onclick = e => { e.preventDefault(); document.getElementById("fssetup").hidden = false; };

	document.getElementById("pending").textContent = state.pending.length ? `Working: ${state.pending.join(", ")}` : "";

	// Edits reach the game after a pause; the last result stays until the next publish
	const p = state.publish;
	const publish = document.getElementById("publish");
	publish.title = p.enabled ? `Edits are sent to running games, then cooked, after a short pause. Send: ${state.send ?? "none"}. Apply: ${state.apply ?? "none"}` : "";
	if (p.running.length)
		publish.innerHTML = `<span class="muted">Publishing ${esc(p.running.join(", "))}...</span>`;
	else if (p.waiting.length)
		publish.innerHTML = `<span class="muted">Will publish ${esc(p.waiting.join(", "))}</span>`;
	else if (p.error)
		publish.innerHTML = `<span class="error">${esc(p.error)}</span>`;
	else
		publish.innerHTML = p.notice ? `<span class="muted">${esc(p.notice)}</span>` : "";

	// The project may supply a command that makes it use the review results
	const apply = document.getElementById("apply");
	apply.hidden = !state.apply;
	apply.title = `Cook now, for changes made outside this tool. Runs: ${state.apply ?? ""}`;
}

// Run the project's apply command after the server has every edit; it can take a while, so the button stays disabled until it ends
document.getElementById("apply").onclick = async e =>
{
	const button = e.currentTarget;
	button.disabled = true;
	try
	{
		await flush_recipe();
		show_message("Applying...", false);
		const r = await fetch("/api/apply", { method: "POST" });
		const s = await r.json();
		adopt_state(s);
		show_message(s.error ?? s.notice ?? "", !!s.error);
	}
	catch (ex)
	{
		show_message(`Apply failed: ${ex.message}`, true);
	}
	finally
	{
		button.disabled = false;
	}
};

// Store the Freesound API credentials; connecting is a separate step through the Freesound login page
document.getElementById("fssave").onclick = async () =>
{
	const body = { client_id: document.getElementById("fsid").value, client_secret: document.getElementById("fssecret").value };
	const r = await fetch("/api/freesound", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
	if (!r.ok)
		show_message(await r.text(), true);

	await refresh();
};

// Show the playback position and let the slider seek
setInterval(() =>
{
	const entry = source_url && buffers.get(source_url);
	if (!entry)
		return;

	const p = position() % entry.buf.duration;
	document.getElementById("pos").value = Math.round(1000 * p / entry.buf.duration);
	document.getElementById("time").textContent = `${p.toFixed(1)} / ${entry.buf.duration.toFixed(1)} s`;
}, 100);

document.getElementById("pos").oninput = e =>
{
	const entry = source_url && buffers.get(source_url);
	if (!entry)
		return;

	const at = entry.buf.duration * e.target.value / 1000;
	if (source)
		start(at);
	else
		offset = at;
};
document.getElementById("play").onclick = () => source || waiting ? stop() : start();
document.getElementById("seam").onclick = seam;
document.getElementById("match").onchange = () => { if (source) start(position()); };
document.getElementById("loopplay").onchange = () => { if (source) start(position()); };
document.getElementById("sf_placement").onchange = update_form;
document.getElementById("sf_save").onclick = save_form;
document.getElementById("sf_delete").onclick = delete_form;
document.getElementById("sf_cancel").onclick = () => select_id(sel_id);
document.addEventListener("keydown", e =>
{
	// Space plays or stops, except while typing
	if (e.code === "Space" && e.target.tagName !== "INPUT" && e.target.tagName !== "SELECT")
	{
		e.preventDefault();
		if (source || waiting)
			stop();
		else
			start();
	}
});

// Add a Freesound recording by number; the server fetches its details and preview
document.getElementById("add").onclick = async () =>
{
	const number = document.getElementById("addnum").value.trim();
	show_message("Fetching...", false);
	await post({ action: "add_freesound", id: sel_id && sel_id !== POOL ? sel_id : null, number });
};

// Search for new candidates for the selected sound in the background; the state is polled until it finishes
document.getElementById("find").onclick = async () =>
{
	await post({ action: "find_candidates", id: sel_id });
};

// The file chosen or dropped for adding, waiting for its credit to be confirmed
let import_file = null;

// Stage a file for adding: show the credit form, filled in from the file's tags where it has them
async function stage_import(file)
{
	// Only one file is added at a time; its name shows which file the form describes
	import_file = file;
	document.getElementById("im_file").textContent = `${file.name} (${(file.size / 1048576).toFixed(1)} MB)`;
	for (const name of ["title", "author", "licence", "url"])
		document.getElementById(`im_${name}`).value = "";

	document.getElementById("im_title").value = file.name.replace(/\.[^.]*$/, "");
	document.getElementById("importform").hidden = false;

	// The suggestion arrives after the upload; a newer file replaces it
	const body = new FormData();
	body.append("file", file);
	const r = await fetch("/api/import/credit", { method: "POST", body });
	if (!r.ok || import_file !== file)
		return;

	const credit = await r.json();
	for (const name of ["title", "author", "licence", "url"])
	{
		if (credit[name])
			document.getElementById(`im_${name}`).value = credit[name];
	}
}

function clear_import()
{
	import_file = null;
	document.getElementById("importform").hidden = true;
	document.getElementById("importfile").value = "";
}

document.getElementById("importpick").onclick = () => document.getElementById("importfile").click();
document.getElementById("importfile").onchange = e =>
{
	if (e.target.files.length)
		stage_import(e.target.files[0]);
};
document.getElementById("im_cancel").onclick = clear_import;

// Add the staged file with the credit in the form, to the selected sound or the unassigned pool
document.getElementById("im_add").onclick = async () =>
{
	// The reply carries the new state, like any review action
	if (!import_file)
		return;

	const body = new FormData();
	body.append("file", import_file);
	if (sel_id && sel_id !== POOL)
		body.append("id", sel_id);

	for (const name of ["title", "author", "licence", "url"])
		body.append(name, document.getElementById(`im_${name}`).value.trim());

	show_message("Adding...", false);
	const r = await fetch("/api/import", { method: "POST", body });
	const s = await r.json();
	adopt_state(s);
	show_message(s.error ?? s.notice ?? "", !!s.error);
	if (!s.error)
		clear_import();
};

// Dropping a file anywhere on the main panel stages it, and stops the browser from opening the file instead
{
	// Highlight the panel while a file is dragged over it
	const main = document.getElementById("main");
	main.addEventListener("dragover", e =>
	{
		if (!e.dataTransfer.types.includes("Files"))
			return;

		e.preventDefault();
		main.classList.add("dropping");
	});
	main.addEventListener("dragleave", e =>
	{
		if (e.target === main)
			main.classList.remove("dropping");
	});
	main.addEventListener("drop", e =>
	{
		main.classList.remove("dropping");
		if (!e.dataTransfer.files.length)
			return;

		e.preventDefault();
		stage_import(e.dataTransfer.files[0]);
	});
}

refresh();
</script>
