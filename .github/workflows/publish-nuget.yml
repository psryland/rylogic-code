name: Publish NuGet Packages

on:
  push:
    tags:
      - 'rylogic-v*.*.*'

concurrency:
  group: nuget-release
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate packages
    runs-on: windows-2025
    timeout-minutes: 90
    # The code-signing environment only accepts rylogic-v* tags and supplies the signing identity, without a reviewer.
    environment: code-signing
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup Visual Studio 2026 MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '[18.0,19.0)'
          msbuild-architecture: x64

      # GitHub-hosted runners restore public dependencies directly from nuget.org.
      - name: Configure NuGet for CI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path 'lib\packages\release' -Force | Out-Null
          @'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <config>
              <add key="repositoryPath" value="packages" />
            </config>
            <packageRestore>
              <add key="enabled" value="true" />
              <add key="automatic" value="true" />
            </packageRestore>
            <packageSources>
              <clear />
              <add key="RylogicRelease" value="lib\packages\release" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          '@ | Set-Content -Path nuget.config

      - name: Install dotnet-script
        run: dotnet tool install --global dotnet-script --version 2.0.0

      - name: Install Sign CLI
        run: dotnet tool install --global sign --version 0.9.1-beta.25379.1

      - name: Validate tag version
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^rylogic-v(?<version>\d+\.\d+\.\d+)$') {
            throw "Release tag '$tag' must have the form rylogic-v1.2.3."
          }

          # Select the exact element because projecting across every PropertyGroup also returns formatting whitespace.
          [xml]$props = Get-Content -Path Directory.Build.props
          $version_nodes = @($props.SelectNodes('/Project/PropertyGroup/RylogicLibraryVersion'))
          if ($version_nodes.Count -ne 1) {
            throw "Directory.Build.props must define RylogicLibraryVersion exactly once."
          }
          $project_version = $version_nodes[0].InnerText.Trim()

          # Require the immutable release tag to match the package version exactly.
          if ($matches.version -cne $project_version) {
            throw "Tag version '$($matches.version)' does not match RylogicLibraryVersion '$project_version'."
          }

          "version=$project_version" >> $env:GITHUB_OUTPUT

      # The GitHub OIDC assertion behind an Azure login expires five minutes after the login, and Azure CLI cannot refresh it. Builds take much
      # longer than that, so they run without signing, and each login immediately precedes a deploy-only step that signs as soon as it starts.
      # The first signing request caches an access token that outlives the rest of the step.
      # The identity can only sign with the Artifact Signing account, so it needs no subscription access.
      - name: Build native libraries
        shell: pwsh
        run: dotnet-script .\script\Build.csx -project AllNative -build -configs Debug Release -notests -nopack

      - name: Azure login for code signing (native)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CODESIGN_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_CODESIGN_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Bootstrap native package
        shell: pwsh
        run: dotnet-script .\script\Build.csx -project AllNative -deploy -configs Debug Release -norestore

      - name: Build public package set
        shell: pwsh
        run: dotnet-script .\script\Build.csx -project AllRylogic -build -configs Debug Release -notests -nopack

      - name: Azure login for code signing (managed)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CODESIGN_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_CODESIGN_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Package public package set
        shell: pwsh
        run: dotnet-script .\script\Build.csx -project AllRylogic -deploy -configs Debug Release -norestore

      - name: Restore representative consumers
        shell: pwsh
        run: |
          $release_dir = Resolve-Path 'lib\packages\release'
          $manifest = Get-Content "$release_dir\manifest.json" -Raw | ConvertFrom-Json
          $consumer_dir = Join-Path $env:RUNNER_TEMP 'rylogic-package-consumer'
          New-Item -ItemType Directory -Path $consumer_dir -Force | Out-Null

          # Reference each package only for the consumer frameworks it ships assemblies for, so primary-framework-only packages still restore.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $references = $manifest.packages | ForEach-Object {
            $archive = [System.IO.Compression.ZipFile]::OpenRead((Join-Path $release_dir $_.file_name))
            try { $lib_tfms = @($archive.Entries | Where-Object { $_.FullName -like 'lib/*/*' } | ForEach-Object { $_.FullName.Split('/')[1] } | Sort-Object -Unique) }
            finally { $archive.Dispose() }
            $condition = if ($lib_tfms.Count -ne 0 -and $lib_tfms -notcontains 'net481') { " Condition=`"'`$(TargetFramework)' != 'net481'`"" } else { '' }
            "    <PackageReference Include=`"$($_.id)`" Version=`"$($manifest.version)`"$condition />"
          }
          @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFrameworks>net10.0-windows7.0;net481</TargetFrameworks>
              <UseWPF>true</UseWPF>
              <UseWindowsForms>true</UseWindowsForms>
            </PropertyGroup>
            <ItemGroup>
          $($references -join [Environment]::NewLine)
            </ItemGroup>
          </Project>
          "@ | Set-Content -Path (Join-Path $consumer_dir 'Consumer.csproj')
          @"
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="RylogicRelease" value="$release_dir" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          "@ | Set-Content -Path (Join-Path $consumer_dir 'nuget.config')
          dotnet restore (Join-Path $consumer_dir 'Consumer.csproj') `
            --configfile (Join-Path $consumer_dir 'nuget.config')

      - name: Upload immutable package set
        uses: actions/upload-artifact@v6
        with:
          name: rylogic-nuget-${{ steps.version.outputs.version }}
          path: |
            lib/packages/release/*.${{ steps.version.outputs.version }}.nupkg
            lib/packages/release/manifest.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish approved package set
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nuget-release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download validated packages
        uses: actions/download-artifact@v4
        with:
          name: rylogic-nuget-${{ needs.build.outputs.version }}
          path: packages

      - name: Verify transferred package set
        shell: pwsh
        run: |
          $manifest = Get-Content 'packages/manifest.json' -Raw | ConvertFrom-Json
          if ($manifest.version -cne '${{ needs.build.outputs.version }}') {
            throw "Downloaded manifest version '$($manifest.version)' does not match the build output."
          }

          $expected = $manifest.packages.file_name | Sort-Object
          $actual = Get-ChildItem 'packages' -File -Filter '*.nupkg' |
            Select-Object -ExpandProperty Name |
            Sort-Object
          if (Compare-Object $expected $actual) {
            throw "Downloaded package inventory does not match the validated manifest."
          }

          foreach ($package in $manifest.packages) {
            $hash = (Get-FileHash "packages/$($package.file_name)" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -cne $package.sha256) {
              throw "Hash mismatch for '$($package.file_name)'."
            }
          }

      - name: Authenticate to nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish packages
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          Get-ChildItem 'packages' -File -Filter '*.nupkg' |
            Sort-Object Name |
            ForEach-Object {
              dotnet nuget push $_.FullName `
                --api-key $env:NUGET_API_KEY `
                --source 'https://www.nuget.org/api/v2/package'
              if ($LASTEXITCODE -ne 0) {
                throw "Publishing '$($_.Name)' failed with exit code $LASTEXITCODE."
              }
            }
